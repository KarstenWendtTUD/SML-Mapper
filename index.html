        <script charset="utf-8" src="https://cdn.plot.ly/plotly-3.7.0.min.js" integrity="sha256-jvTGqxNp8AGWEcvNLVuKr+8j5dGe9Yw51LQkmDH+IYA=" crossorigin="anonymous"></script>                <div id="946add00-ba22-4b02-bdad-78c6acc788c7" class="plotly-graph-div" style="height:100%; width:100%;"></div>            <script>                window.PLOTLYENV=window.PLOTLYENV || {};                                if (document.getElementById("946add00-ba22-4b02-bdad-78c6acc788c7")) {                    Plotly.newPlot(                        "946add00-ba22-4b02-bdad-78c6acc788c7",                        [{"hoverinfo":"text","hoverlabel":{"align":"left","bgcolor":"white","bordercolor":"#cccccc","font":{"color":"#222222","size":11},"namelength":0},"hovertext":["\u003cb\u003eAutomatisiertes Fahren\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eCluster\u003c\u002fb\u003e: Automatisierte & vernetzte Fahrzeuge\u003cbr\u003e\u003cb\u003eBeschreibung\u003c\u002fb\u003e: Motivation: Verkehrsunf\u00e4lle werden zu \u00fcber 90% durch menschliches Fehlverhalten\u003cbr\u003everursacht \u2013 automatisierte Fahrsysteme versprechen eine drastische Reduktion\u003cbr\u003evon Unfallzahlen, Staus und Emissionen, indem sie Wahrnehmung,\u003cbr\u003eSituationsbewertung, Planung und Regelung vollst\u00e4ndig maschinell \u00fcbernehmen.\u003cbr\u003eGesellschaftlich er\u00f6ffnet vollst\u00e4ndige Fahrerlosigkeit zus\u00e4tzlich\u003cbr\u003eMobilit\u00e4tszugang f\u00fcr Personen, die heute aus Alters- oder Einschr\u00e4nkungsgr\u00fcnden\u003cbr\u003ekein Fahrzeug f\u00fchren k\u00f6nnen, und schafft die technologische Grundlage f\u00fcr\u003cbr\u003efahrerlose Logistik und \u00f6ffentlichen Nahverkehr.\u003cbr\u003e\u003cbr\u003eL\u00f6sungsans\u00e4tze: Die Fahrzeugautomatisierung basiert auf einer modularen\u003cbr\u003eFunktionskette aus Umfeldwahrnehmung, Situationsbewertung, Trajektorienplanung\u003cbr\u003eund Regelungsausf\u00fchrung, bei der datengetriebene und modellbasierte Verfahren \u2026","\u003cb\u003eVernetztes Fahren & Fahrzeug-Umgebung-Kommunikation\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eCluster\u003c\u002fb\u003e: Automatisierte & vernetzte Fahrzeuge\u003cbr\u003e\u003cb\u003eBeschreibung\u003c\u002fb\u003e: Motivation: Einzelne Fahrzeuge k\u00f6nnen ihre Umgebung nur bis zur optischen und\u003cbr\u003esensorischen Reichweite erfassen \u2013 kritische Gefahren hinter Kurven, an\u003cbr\u003everdeckten Kreuzungen oder bei schlechter Sicht bleiben unsichtbar. Durch\u003cbr\u003eEchtzeit-Datenaustausch zwischen Fahrzeugen, Infrastruktur, Netzknoten und\u003cbr\u003eungesch\u00fctzten Verkehrsteilnehmern l\u00e4sst sich das kollektive Lagebild aller\u003cbr\u003eBeteiligten dramatisch erweitern und die Unfallzahl Sch\u00e4tzungen zufolge um\u003cbr\u003e20\u201360% senken. Vernetzung ist dar\u00fcber hinaus Grundvoraussetzung f\u00fcr kooperative\u003cbr\u003eMan\u00f6ver wie Kolonnenfahrt, die den Energieverbrauch und die Stra\u00dfenkapazit\u00e4t\u003cbr\u003everbessern.\u003cbr\u003e\u003cbr\u003eL\u00f6sungsans\u00e4tze: Die Forschung entwickelt standardisierte Nachrichtenformate und\u003cbr\u003eProtokollarchitekturen f\u00fcr den direkten Fahrzeug-zu-Fahrzeug-Austausch sowie f\u00fcr\u003cbr\u003ezellulare \u2026","\u003cb\u003eFahrdynamik & Regelungstechnik autonomer Systeme\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eCluster\u003c\u002fb\u003e: Automatisierte & vernetzte Fahrzeuge\u003cbr\u003e\u003cb\u003eBeschreibung\u003c\u002fb\u003e: Motivation: Die pr\u00e4zise F\u00fchrung eines Fahrzeugs entlang einer geplanten\u003cbr\u003eTrajektorie ist eine Kernvoraussetzung f\u00fcr sicheres autonomes Fahren \u2013\u003cbr\u003eAbweichungen in der Quer- oder L\u00e4ngsdynamik k\u00f6nnen in kritischen Situationen\u003cbr\u003edirekt zu Kontrollverlust f\u00fchren. Besonders in hochdynamischen Szenarien wie\u003cbr\u003eAusweichman\u00f6vern, Spurwechseln unter Grenzbedinungen und Gel\u00e4ndefahrt sto\u00dfen\u003cbr\u003eeinfache lineare Regler an ihre Grenzen, da nichtlineare Fahrdynamik- und\u003cbr\u003eReifeneffekte dominieren.\u003cbr\u003e\u003cbr\u003eL\u00f6sungsans\u00e4tze: Modellpr\u00e4diktive Regelung hat sich als vielversprechendster\u003cbr\u003eAnsatz etabliert, weil sie L\u00e4ngs- und Querdynamik gleichzeitig ber\u00fccksichtigt,\u003cbr\u003eStellgr\u00f6\u00dfenbeschr\u00e4nkungen einhalten kann und vorausschauend auf die geplante\u003cbr\u003eTrajektorie reagiert. Erg\u00e4nzend werden robuste Verfahren wie Sliding-Mode-Regler\u003cbr\u003eeingesetzt, \u2026"],"legendgroup":"Automatisierte & vernetzte Fahrzeuge","marker":{"color":"#46b4f6","line":{"color":"#46b4f6","width":80.0},"opacity":0.8,"size":140.0,"symbol":"line-ew"},"mode":"markers+text","name":"Automatisierte & vernetzte Fahrzeuge","showlegend":true,"text":["Automatisiertes Fahren","Vernetztes Fahren &\u003cbr\u003eFahrzeug-Umgebung-\u003cbr\u003eKommunikation","Fahrdynamik &\u003cbr\u003eRegelungstechnik\u003cbr\u003eautonomer Systeme"],"textfont":{"color":"white","family":"Arial","size":15},"textposition":"middle center","x":[38.5789264453657,36.05709534486965,38.06871771822673],"y":[25.255501432873114,38.68540764760734,5.285755940038351],"type":"scatter"},{"hoverinfo":"text","hoverlabel":{"align":"left","bgcolor":"white","bordercolor":"#cccccc","font":{"color":"#222222","size":11},"namelength":0},"hovertext":["\u003cb\u003eUnbemannte Flugsysteme\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eCluster\u003c\u002fb\u003e: Unbemannte Luftfahrt & Luftmobilit\u00e4t\u003cbr\u003e\u003cb\u003eBeschreibung\u003c\u002fb\u003e: Motivation: Unbemannte Flugsysteme erschlie\u00dfen Einsatzfelder, die mit bemannter\u003cbr\u003eLuftfahrt aus Sicherheits- oder Kostengr\u00fcnden nicht realisierbar sind \u2013 darunter\u003cbr\u003eInfrastrukturinspektion in gef\u00e4hrlichen Umgebungen, gro\u00dffl\u00e4chige\u003cbr\u003eUmwelt\u00fcberwachung, Katastrophenhilfe und Versorgung abgelegener Regionen.\u003cbr\u003eGesellschaftlich relevant ist die Technologie auch f\u00fcr strukturschwache\u003cbr\u003el\u00e4ndliche R\u00e4ume, in denen Drohnen Versorgungsl\u00fccken in Logistik und\u003cbr\u003eLandwirtschaft schlie\u00dfen k\u00f6nnen.\u003cbr\u003e\u003cbr\u003eL\u00f6sungsans\u00e4tze: Die Forschung adressiert die gesamte Systemkette von neuartigen\u003cbr\u003ePlattformkonfigurationen \u2013 etwa Hybridkonzepte aus Starrfl\u00fcgler und Multikopter\u003cbr\u003e\u2013 \u00fcber redundante Antriebssysteme bis hin zu intelligenten Missionssystemen mit\u003cbr\u003eautomatisierter Zustands\u00fcberwachung und Fehlerreaktion. F\u00fcr den Betrieb jenseits\u003cbr\u003eder \u2026","\u003cb\u003eElektrisch angetriebene Senkrechtstarter f\u00fcr urbane Luftmobilit\u00e4t\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eCluster\u003c\u002fb\u003e: Unbemannte Luftfahrt & Luftmobilit\u00e4t\u003cbr\u003e\u003cb\u003eBeschreibung\u003c\u002fb\u003e: Motivation: Wachsende Urbanisierung erzeugt in St\u00e4dten Verkehrsengp\u00e4sse, die mit\u003cbr\u003ebodengebundener Infrastruktur allein kaum l\u00f6sbar sind; elektrisch angetriebene\u003cbr\u003eSenkrechtstarter k\u00f6nnen den bislang ungenutzten Niederluftrum als zus\u00e4tzliche\u003cbr\u003eVerkehrsebene erschlie\u00dfen. Gesellschaftlich relevanter Nutzen liegt vor allem in\u003cbr\u003ezeitkritischen Anwendungen wie medizinischem Notfalltransport und in der\u003cbr\u003eAnbindung abgelegener Regionen, wo konventionelle Verkehrstr\u00e4ger versagen.\u003cbr\u003e\u003cbr\u003eL\u00f6sungsans\u00e4tze: Die Forschung entwickelt Plattformkonzepte mit verteilten,\u003cbr\u003eredundanten Antriebsmodulen, die beim Ausfall einzelner Komponenten stabil\u003cbr\u003ebleiben, kombiniert mit aerodynamischer Optimierung zur Reduktion von L\u00e4rm- und\u003cbr\u003eEnergieverbrauch. Parallel werden Vertiport-Konzepte und\u003cbr\u003eLuftraumintegrationsarchitekturen \u2026","\u003cb\u003eDrohnenluftverkehrsmanagement & digitale Luftrauminfrastruktur\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eCluster\u003c\u002fb\u003e: Unbemannte Luftfahrt & Luftmobilit\u00e4t\u003cbr\u003e\u003cb\u003eBeschreibung\u003c\u002fb\u003e: Motivation: Die stark wachsende Zahl kommerzieller Drohnen im Niederluftrum\u003cbr\u003eerfordert eine systematische Verkehrsorganisation, damit Kollisionen vermieden,\u003cbr\u003ekritische Infrastruktur gesch\u00fctzt und gleichzeitig legitime Nutzungen wie\u003cbr\u003emedizinische Transporte oder Inspektionsfl\u00fcge zuverl\u00e4ssig erm\u00f6glicht werden.\u003cbr\u003eOhne eine digitale Luftrauminfrastruktur bleibt der Drohnenbetrieb auf wenige\u003cbr\u003eEinzelgenehmigungen beschr\u00e4nkt \u2013 ein skalierbarer, gesellschaftlich n\u00fctzlicher\u003cbr\u003eEinsatz ist damit strukturell ausgeschlossen.\u003cbr\u003e\u003cbr\u003eL\u00f6sungsans\u00e4tze: Digitale Luftraummanagementdienste umfassen Identifikation,\u003cbr\u003eTelemetrieverfolgung, automatisierte Missionsplanung, Konflikterkennung und\u003cbr\u003e-aufl\u00f6sung sowie dynamische Sperrzonenverwaltung, die als koordinierte\u003cbr\u003eDiensteschicht \u00fcber bestehende Luftsicherungsinfrastruktur gelegt \u2026"],"legendgroup":"Unbemannte Luftfahrt & Luftmobilit\u00e4t","marker":{"color":"#510ae1","line":{"color":"#510ae1","width":80.0},"opacity":0.8,"size":140.0,"symbol":"line-ew"},"mode":"markers+text","name":"Unbemannte Luftfahrt & Luftmobilit\u00e4t","showlegend":true,"text":["Unbemannte Flugsysteme","Elektrisch\u003cbr\u003eangetriebene\u003cbr\u003eSenkrechtstarter f\u00fcr\u003cbr\u003eurbane Luftmobilit\u00e4t","Drohnenluftverkehrsman\u003cbr\u003eagement & digitale\u003cbr\u003eLuftrauminfrastruktur"],"textfont":{"color":"white","family":"Arial","size":15},"textposition":"middle center","x":[83.30355650843441,28.687064151943506,90.28943055211246],"y":[53.09150095600696,67.10948340960115,60.24674825053601],"type":"scatter"},{"hoverinfo":"text","hoverlabel":{"align":"left","bgcolor":"white","bordercolor":"#cccccc","font":{"color":"#222222","size":11},"namelength":0},"hovertext":["\u003cb\u003eSchwarmintelligenz & Multi-Agenten-Koordination\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eCluster\u003c\u002fb\u003e: Schwarm- & Feldrobotik\u003cbr\u003e\u003cb\u003eBeschreibung\u003c\u002fb\u003e: Motivation: Viele gesellschaftlich relevante Aufgaben \u2013 gro\u00dffl\u00e4chige\u003cbr\u003eUmwelt\u00fcberwachung, Katastropheneinsatz, Fl\u00e4chenbewirtschaftung in der\u003cbr\u003eLandwirtschaft \u2013 \u00fcberfordern einzelne autonome Systeme in Reichweite,\u003cbr\u003eAusfallsicherheit und Bearbeitungsgeschwindigkeit. Schw\u00e4rme aus vielen\u003cbr\u003eeinfachen, dezentral koordinierten Agenten k\u00f6nnen solche Aufgaben parallelisiert\u003cbr\u003eund fehlertoleranter bew\u00e4ltigen, da der Ausfall einzelner Einheiten das\u003cbr\u003eGesamtsystem nicht lahmlegt.\u003cbr\u003e\u003cbr\u003eL\u00f6sungsans\u00e4tze: Dezentrale Koordinationsalgorithmen, inspiriert von biologischen\u003cbr\u003eSchw\u00e4rmen, erm\u00f6glichen kollektives Verhalten ohne zentralen Kontrollknoten,\u003cbr\u003eindem jeder Agent nur auf lokale Informationen seiner Nachbarn reagiert.\u003cbr\u003eVerteilte Aufgabenallokationsverfahren und robuste Kommunikationsarchitekturen\u003cbr\u003esichern die Koh\u00e4sion des \u2026","\u003cb\u003eAutonome Agrarsysteme & Feldrobotik\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eCluster\u003c\u002fb\u003e: Schwarm- & Feldrobotik\u003cbr\u003e\u003cb\u003eBeschreibung\u003c\u002fb\u003e: Motivation: Die Landwirtschaft steht unter zunehmendem Druck durch\u003cbr\u003eFachkr\u00e4ftemangel, steigende Anforderungen an \u00f6kologische Nachhaltigkeit und die\u003cbr\u003eNotwendigkeit, mit weniger Betriebsmitteln wie D\u00fcnger und Pflanzenschutz h\u00f6here\u003cbr\u003eFl\u00e4chenleistungen zu erzielen. Autonome Feldsysteme versprechen eine\u003cbr\u003eressourcenschonendere, standortgenaue Bewirtschaftung, die bodenschonend und mit\u003cbr\u003edeutlich reduziertem Chemikalieneinsatz arbeitet und damit sowohl \u00f6kologische\u003cbr\u003eals auch \u00f6konomische Nachhaltigkeitsziele adressiert.\u003cbr\u003e\u003cbr\u003eL\u00f6sungsans\u00e4tze: Hersteller\u00fcbergreifende Technologieplattformen f\u00fcr Schw\u00e4rme aus\u003cbr\u003ebemannten und unbemannten Landmaschinen erlauben es, dass ein einzelner Bediener\u003cbr\u003emehrere Systeme gleichzeitig \u00fcberwacht und im Bedarfsfall eingreift, anstatt\u003cbr\u003ejede Maschine einzeln zu f\u00fchren. Lernbasierte \u2026","\u003cb\u003eMensch-Roboter-Kollaboration\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eCluster\u003c\u002fb\u003e: Schwarm- & Feldrobotik\u003cbr\u003e\u003cb\u003eBeschreibung\u003c\u002fb\u003e: Motivation: Demografischer Wandel und Fachkr\u00e4ftemangel zwingen Industrie,\u003cbr\u003eLandwirtschaft und Gesundheitswesen dazu, menschliche Arbeitskraft durch\u003cbr\u003erobotische Systeme zu erg\u00e4nzen \u2013 nicht zu ersetzen; kollaborative Roboter\u003cbr\u003eerm\u00f6glichen dabei eine Kombination menschlicher Urteilsf\u00e4higkeit mit\u003cbr\u003emaschineller Pr\u00e4zision und Ausdauer. Besonders in kleinen und mittleren\u003cbr\u003eBetrieben sowie in mobilen Einsatzszenarien wie der Feldarbeit fehlen bislang\u003cbr\u003ekosteng\u00fcnstige, einfach konfigurierbare L\u00f6sungen, die ohne spezialisiertes\u003cbr\u003eIngenieurtum eingef\u00fchrt werden k\u00f6nnen.\u003cbr\u003e\u003cbr\u003eL\u00f6sungsans\u00e4tze: Kollaborative Roboter nutzen kraft- und leistungsbegrenzte\u003cbr\u003eAntriebe mit taktiler Sensorik, um Kollisionen mit Menschen zu erkennen und\u003cbr\u003esofort darauf zu reagieren; erg\u00e4nzende Verfahren zur Intentionserkennung \u2013 etwa\u003cbr\u003e\u00fcber \u2026","\u003cb\u003eUmwelt- & Rekultivierungsrobotik\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eCluster\u003c\u002fb\u003e: Schwarm- & Feldrobotik\u003cbr\u003e\u003cb\u003eBeschreibung\u003c\u002fb\u003e: Motivation: Jahrzehntelanger Braunkohletagebau hat in der Lausitz und anderen\u003cbr\u003eBergbauregionen gro\u00dffl\u00e4chige, \u00f6kologisch degradierte Folgefl\u00e4chen hinterlassen,\u003cbr\u003ederen Renaturierung gesetzlich vorgeschrieben, aber mit menschlicher\u003cbr\u003eArbeitskraft allein kaum skalierbar ist. Robotische Systeme k\u00f6nnen zudem\u003cbr\u003eDekontaminationsaufgaben in chemisch oder radiologisch belasteten Umgebungen\u003cbr\u003e\u00fcbernehmen und Menschen dauerhaft aus gesundheitsgef\u00e4hrdenden Arbeitsbereichen\u003cbr\u003eheraushalten.\u003cbr\u003e\u003cbr\u003eL\u00f6sungsans\u00e4tze: Forschungsans\u00e4tze kombinieren teleoperierten\u003cbr\u003eSchwermaschineneinsatz mit autonomer Kartierung und 3D-Navigation in unbekanntem\u003cbr\u003eGel\u00e4nde, sodass Baggerarbeiten, Bodenprobenentnahme und Gefahrstoffbergung ohne\u003cbr\u003epermanente menschliche Pr\u00e4senz vor Ort ausgef\u00fchrt werden k\u00f6nnen. Lernbasierte\u003cbr\u003eGel\u00e4ndeklassifikation \u2026"],"legendgroup":"Schwarm- & Feldrobotik","marker":{"color":"#51caf6","line":{"color":"#51caf6","width":80.0},"opacity":0.8,"size":140.0,"symbol":"line-ew"},"mode":"markers+text","name":"Schwarm- & Feldrobotik","showlegend":true,"text":["Schwarmintelligenz &\u003cbr\u003eMulti-Agenten-\u003cbr\u003eKoordination","Autonome Agrarsysteme\u003cbr\u003e& Feldrobotik","Mensch-Roboter-\u003cbr\u003eKollaboration","Umwelt- &\u003cbr\u003eRekultivierungsrobotik"],"textfont":{"color":"white","family":"Arial","size":15},"textposition":"middle center","x":[76.00453289699297,56.44982463416735,72.21728172499618,60.00669478272659],"y":[61.49842735288123,73.32437543138231,84.45564115929223,83.00381073688911],"type":"scatter"},{"hoverinfo":"text","hoverlabel":{"align":"left","bgcolor":"white","bordercolor":"#cccccc","font":{"color":"#222222","size":11},"namelength":0},"hovertext":["\u003cb\u003eTelerobotik, Fernoperation & immersive Operatorschnittstellen\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eCluster\u003c\u002fb\u003e: Telerobotik & XR & Simulation\u003cbr\u003e\u003cb\u003eBeschreibung\u003c\u002fb\u003e: Motivation: In gef\u00e4hrlichen Umgebungen wie Chemieunf\u00e4llen, kontaminierten\u003cbr\u003eIndustriearealen oder Tr\u00fcmmerlagen sch\u00fctzt Telerobotik menschliche\u003cbr\u003eEinsatzkr\u00e4fte, indem sie physische Pr\u00e4senz durch ferngesteuerte Systeme ersetzt\u003cbr\u003e\u2013 gleichzeitig er\u00f6ffnet sie Anwendungen wie medizinische Ferneingriffe, die\u003cbr\u003ehochqualifizierte Versorgung unabh\u00e4ngig vom Standort erm\u00f6glichen. Da klassische\u003cbr\u003eBildschirminterfaces die dreidimensionale Realit\u00e4t einer Fernumgebung nur\u003cbr\u003eunzureichend \u00fcbertragen, sind immersive Darstellungsformen f\u00fcr r\u00e4umlich pr\u00e4zise\u003cbr\u003eManipulation und sicheres Situationsbewusstsein des Operators keine\u003cbr\u003eKomfortoption, sondern funktionale Notwendigkeit.\u003cbr\u003e\u003cbr\u003eL\u00f6sungsans\u00e4tze: Moderne Teleoperationssysteme \u00fcbertragen Kraft- und\u003cbr\u003eBewegungsinformationen bidirektional mit haptischem Feedback und nutzen \u2026","\u003cb\u003eDigitale Zwillinge mobiler Systeme\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eCluster\u003c\u002fb\u003e: Telerobotik & XR & Simulation\u003cbr\u003e\u003cb\u003eBeschreibung\u003c\u002fb\u003e: Motivation: Komplexe Mobilit\u00e4tssysteme \u2013 von autonomen Fahrzeugen \u00fcber\u003cbr\u003eVerkehrsnetze bis hin zu Energieinfrastrukturen \u2013 erzeugen Betriebszust\u00e4nde, die\u003cbr\u003esich mit klassischen Methoden weder hinreichend beobachten noch prognostizieren\u003cbr\u003elassen; digitale Zwillinge schaffen eine kontinuierliche, datengest\u00fctzte Br\u00fccke\u003cbr\u003ezwischen physischer Realit\u00e4t und Modellwelt. Gesellschaftlich relevant ist die\u003cbr\u003eTechnologie, weil sie vorausschauende Instandhaltung erm\u00f6glicht, ungeplante\u003cbr\u003eAusf\u00e4lle kritischer Infrastruktur reduziert und gleichzeitig Ressourcenverbrauch\u003cbr\u003edurch optimierte Betriebsf\u00fchrung senkt.\u003cbr\u003e\u003cbr\u003eL\u00f6sungsans\u00e4tze: Digitale Zwillinge verkn\u00fcpfen Echtzeit-Sensorstr\u00f6me aus\u003cbr\u003ephysischen Systemen mit hochgenauen Simulationsmodellen \u00fcber standardisierte\u003cbr\u003eDatenschnittstellen, sodass Zustands\u00e4nderungen am realen \u2026","\u003cb\u003eSzenarienbasierte Testmethodik & cyberphysischer Versuchsaufbau\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eCluster\u003c\u002fb\u003e: Telerobotik & XR & Simulation\u003cbr\u003e\u003cb\u003eBeschreibung\u003c\u002fb\u003e: Motivation: Autonome Systeme aller Klassen \u2013 Stra\u00dfenfahrzeuge,\u003cbr\u003eSchienenfahrzeuge, Drohnen, Landmaschinen, Wasserfahrzeuge und Kleinstmobile \u2013\u003cbr\u003ek\u00f6nnen nicht allein durch Realerprobung abgesichert werden, da die Kombinatorik\u003cbr\u003erelevanter Betriebssituationen jeden praktisch leistbaren Testumfang weit\u003cbr\u003e\u00fcbersteigt. Szenarienbasierte Testmethoden reduzieren diesen Suchraum durch\u003cbr\u003esystematische Ableitung repr\u00e4sentativer Situationsklassen aus Realdaten und\u003cbr\u003eerm\u00f6glichen so einen formal nachvollziehbaren Sicherheitsnachweis als Grundlage\u003cbr\u003ef\u00fcr Zulassungsverfahren.\u003cbr\u003e\u003cbr\u003eL\u00f6sungsans\u00e4tze: Cyberphysische Versuchsaufbauten verbinden reale Plattformen und\u003cbr\u003eSteuerger\u00e4te \u2013 ob Fahrsimulator, Drohnenpr\u00fcfstand oder Agrarmaschinentestfeld \u2013\u003cbr\u003emit simulierten Umgebungen in einer gemeinsamen Echtzeit-Architektur, sodass \u2026"],"legendgroup":"Telerobotik & XR & Simulation","marker":{"color":"#0aa4e5","line":{"color":"#0aa4e5","width":80.0},"opacity":0.8,"size":140.0,"symbol":"line-ew"},"mode":"markers+text","name":"Telerobotik & XR & Simulation","showlegend":true,"text":["Telerobotik,\u003cbr\u003eFernoperation &\u003cbr\u003eimmersive\u003cbr\u003eOperatorschnittstellen","Digitale Zwillinge\u003cbr\u003emobiler Systeme","Szenarienbasierte\u003cbr\u003eTestmethodik &\u003cbr\u003ecyberphysischer\u003cbr\u003eVersuchsaufbau"],"textfont":{"color":"white","family":"Arial","size":15},"textposition":"middle center","x":[67.60624348534279,29.56067844485641,64.13688598166289],"y":[67.03920691773142,20.93448268710145,32.85007560708292],"type":"scatter"},{"hoverinfo":"text","hoverlabel":{"align":"left","bgcolor":"white","bordercolor":"#cccccc","font":{"color":"#222222","size":11},"namelength":0},"hovertext":["\u003cb\u003eK\u00fcnstliche Intelligenz & maschinelles Lernen f\u00fcr autonome Mobilit\u00e4t\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eCluster\u003c\u002fb\u003e: KI & Wahrnehmung & Daten\u003cbr\u003e\u003cb\u003eBeschreibung\u003c\u002fb\u003e: Motivation: Regelbasierte Systeme sto\u00dfen in der Vielfalt realer Verkehrs- und\u003cbr\u003eUmweltsituationen an Grenzen, die manuell nicht vollst\u00e4ndig antizipierbar sind;\u003cbr\u003elernbasierte Verfahren erm\u00f6glichen es autonomen Systemen, aus Erfahrungsdaten\u003cbr\u003esituationsadaptives Verhalten zu generalisieren, das \u00fcber explizit programmierte\u003cbr\u003eRegeln hinausgeht. Gesellschaftlich ist die Technologie entscheidend f\u00fcr die\u003cbr\u003eBreitenanwendung autonomer Systeme \u2013 von Fahrzeugen \u00fcber Drohnen bis hin zu\u003cbr\u003eLandmaschinen \u2013, weil sie Kosten und Entwicklungsaufwand f\u00fcr die\u003cbr\u003eSystemspezifikation drastisch reduziert.\u003cbr\u003e\u003cbr\u003eL\u00f6sungsans\u00e4tze: Tiefes Lernen adressiert Wahrnehmungsaufgaben wie\u003cbr\u003eObjekterkennung und Szenenverst\u00e4ndnis, best\u00e4rkendes Lernen optimiert Steuerungs-\u003cbr\u003eund Planungsaufgaben durch Interaktion mit simulierten Umgebungen, und \u2026","\u003cb\u003eUmfeldsensorik & Wahrnehmungssysteme\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eCluster\u003c\u002fb\u003e: KI & Wahrnehmung & Daten\u003cbr\u003e\u003cb\u003eBeschreibung\u003c\u002fb\u003e: Motivation: Autonome Systeme jeder Klasse \u2013 Stra\u00dfenfahrzeuge, Drohnen,\u003cbr\u003eFeldroboter \u2013 sind in ihrer Handlungsf\u00e4higkeit fundamental auf eine zuverl\u00e4ssige\u003cbr\u003eWahrnehmung ihrer Umgebung angewiesen; Fehler in der Wahrnehmungsschicht\u003cbr\u003epflanzen sich direkt in fehlerhafte Entscheidungen fort und gef\u00e4hrden Mensch und\u003cbr\u003eUmwelt. Gesellschaftlich bedeutsam ist, dass robuste Allwettersensorik eine\u003cbr\u003eGrundvoraussetzung daf\u00fcr ist, autonome Systeme aus kontrollierten Testumgebungen\u003cbr\u003ein den unvorhersehbaren Realbetrieb zu \u00fcberf\u00fchren und damit ihren\u003cbr\u003egesellschaftlichen Nutzen tats\u00e4chlich zu entfalten.\u003cbr\u003e\u003cbr\u003eL\u00f6sungsans\u00e4tze: Sensorfusion kombiniert komplement\u00e4re Messprinzipien \u2013\u003cbr\u003eLaserscanner f\u00fcr hochaufl\u00f6sende Tiefenerfassung, Radar f\u00fcr Allwetterrobustheit\u003cbr\u003eund Geschwindigkeitsmessung, Kamera f\u00fcr Textur- und Farberkennung \u2013 \u2026","\u003cb\u003eEchtzeit-Lokalisierung & Navigation\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eCluster\u003c\u002fb\u003e: KI & Wahrnehmung & Daten\u003cbr\u003e\u003cb\u003eBeschreibung\u003c\u002fb\u003e: Motivation: Zuverl\u00e4ssige Positionsbestimmung ist eine elementare Voraussetzung\u003cbr\u003ef\u00fcr den sicheren Betrieb autonomer Systeme \u2013 Fahrzeuge, Drohnen, Feldroboter und\u003cbr\u003eWasserfahrzeuge gleicherma\u00dfen \u2013, doch Satellitennavigation versagt in Tunneln,\u003cbr\u003eGeb\u00e4uden, dicht besiedelten Stadtr\u00e4umen und zunehmend auch durch absichtliche\u003cbr\u003eSt\u00f6rsignale in Konfliktregionen. Gesellschaftlich kritisch wird diese\u003cbr\u003eAbh\u00e4ngigkeit, weil sicherheitsrelevante Infrastruktur wie autonome\u003cbr\u003eNotfalldrohnen oder fahrerlose Transportsysteme nur dann verl\u00e4sslich eingesetzt\u003cbr\u003ewerden kann, wenn satellitenunabh\u00e4ngige R\u00fcckfallebenen existieren.\u003cbr\u003e\u003cbr\u003eL\u00f6sungsans\u00e4tze: Simultane Lokalisierung und Kartierung kombiniert Sensordaten\u003cbr\u003eaus Laserscannern, Kameras und Inertialmesseinheiten, um parallel eine\u003cbr\u003eUmgebungskarte aufzubauen und die eigene \u2026","\u003cb\u003eMobilit\u00e4tsdaten, Datenplattformen & Analytik\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eCluster\u003c\u002fb\u003e: KI & Wahrnehmung & Daten\u003cbr\u003e\u003cb\u003eBeschreibung\u003c\u002fb\u003e: Motivation: Verkehrsplanung, autonome Systemsteuerung und\u003cbr\u003eMobilit\u00e4tsdienstleistungen sind zunehmend auf den kontinuierlichen Zugang zu\u003cbr\u003ehochwertigen Echtzeit- und Langzeitdaten aus Fahrzeugen, Infrastruktur und\u003cbr\u003eFeldger\u00e4ten angewiesen \u2013 ohne diese Datenbasis bleiben Optimierungspotenziale in\u003cbr\u003eEffizienz, Sicherheit und Emissionsreduktion ungenutzt. Gesellschaftlich\u003cbr\u003erelevant ist insbesondere die gleichberechtigte Zug\u00e4nglichkeit dieser Daten:\u003cbr\u003eRestriktive Gesch\u00e4ftsmodelle und fehlende Interoperabilit\u00e4t verhindern derzeit,\u003cbr\u003edass \u00f6ffentliche Stellen, Forschung und kleine Akteure Mobilit\u00e4tsdaten f\u00fcr\u003cbr\u003egemeinwohlorientierte Zwecke nutzen k\u00f6nnen.\u003cbr\u003e\u003cbr\u003eL\u00f6sungsans\u00e4tze: Datentreuh\u00e4nder-Modelle schaffen einen neutralen\u003cbr\u003einstitutionellen Rahmen, in dem Datengeber souver\u00e4n kontrollieren, wer unter\u003cbr\u003ewelchen \u2026"],"legendgroup":"KI & Wahrnehmung & Daten","marker":{"color":"#3d79f5","line":{"color":"#3d79f5","width":80.0},"opacity":0.8,"size":140.0,"symbol":"line-ew"},"mode":"markers+text","name":"KI & Wahrnehmung & Daten","showlegend":true,"text":["K\u00fcnstliche Intelligenz\u003cbr\u003e& maschinelles Lernen\u003cbr\u003ef\u00fcr autonome Mobilit\u00e4t","Umfeldsensorik &\u003cbr\u003eWahrnehmungssysteme","Echtzeit-Lokalisierung\u003cbr\u003e& Navigation","Mobilit\u00e4tsdaten,\u003cbr\u003eDatenplattformen &\u003cbr\u003eAnalytik"],"textfont":{"color":"white","family":"Arial","size":15},"textposition":"middle center","x":[46.684569204882955,48.37294835654356,51.39661407470703,11.030528062813561],"y":[10.571401328342105,79.22048173944343,43.79115295410156,31.24150892513881],"type":"scatter"},{"hoverinfo":"text","hoverlabel":{"align":"left","bgcolor":"white","bordercolor":"#cccccc","font":{"color":"#222222","size":11},"namelength":0},"hovertext":["\u003cb\u003eMobilfunknetze der f\u00fcnften und sechsten Generation f\u00fcr mobile Systeme\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eCluster\u003c\u002fb\u003e: Kommunikation & Systemarchitektur\u003cbr\u003e\u003cb\u003eBeschreibung\u003c\u002fb\u003e: Motivation: Autonome Fahrzeuge, Drohnen und Industrieroboter sind auf eine\u003cbr\u003ezuverl\u00e4ssige, latenzarme Kommunikationsinfrastruktur als funktionale\u003cbr\u003eGrundvoraussetzung angewiesen \u2013 bestehende vierte Generation und fr\u00fche f\u00fcnfte\u003cbr\u003eGeneration reichen f\u00fcr sicherheitskritische Regelkreise mit Latenzanforderungen\u003cbr\u003eunter f\u00fcnf Millisekunden noch nicht hinreichend aus. Gesellschaftlich bedeutsam\u003cbr\u003eist dies, weil die n\u00e4chste Generation autonomer Infrastruktur \u2013 vom fahrerlosen\u003cbr\u003eNahverkehr bis zur ferngesteuerten Chirurgie \u2013 nur dann fl\u00e4chendeckend\u003cbr\u003eeinsetzbar wird, wenn die Kommunikationsnetze garantierte Verbindungsqualit\u00e4t\u003cbr\u003estatt statistisch optimierter Durchschnittswerte liefern.\u003cbr\u003e\u003cbr\u003eL\u00f6sungsans\u00e4tze: Network-Slicing reserviert logisch isolierte Netzwerkressourcen\u003cbr\u003eexklusiv f\u00fcr sicherheitskritische Anwendungen, \u2026","\u003cb\u003eSystemintegration & Interoperabilit\u00e4t heterogener Plattformen\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eCluster\u003c\u002fb\u003e: Kommunikation & Systemarchitektur\u003cbr\u003e\u003cb\u003eBeschreibung\u003c\u002fb\u003e: Motivation: Autonome Mobilit\u00e4tssysteme aus verschiedenen Dom\u00e4nen \u2013 Fahrzeuge,\u003cbr\u003eDrohnen, Schienenfahrzeuge, Roboter \u2013 werden zunehmend in gemeinsamen\u003cbr\u003eInfrastrukturen betrieben, die eine \u00fcbergreifende Steuerung, Datenkommunikation\u003cbr\u003eund Zustandsbeobachtung erfordern; fehlende Interoperabilit\u00e4t zwingt dabei zu\u003cbr\u003ekostspieligem Spezialaufwand bei jeder neuen Systemkombination. Gesellschaftlich\u003cbr\u003erelevant ist dies, weil skalierbare und offene Integrationsarchitekturen die\u003cbr\u003eeinzige M\u00f6glichkeit sind, heterogene Flotten und hybride Systeme wirtschaftlich\u003cbr\u003eund sicherheitstechnisch tragf\u00e4hig zu betreiben.\u003cbr\u003e\u003cbr\u003eL\u00f6sungsans\u00e4tze: Modulare Softwareparadigmen mit kontraktbasierten Schnittstellen\u003cbr\u003eerm\u00f6glichen das sichere Hinzuf\u00fcgen, Entfernen oder Aktualisieren einzelner\u003cbr\u003eSystemkomponenten zur Laufzeit, ohne die \u2026","\u003cb\u003eDeterministische Echtzeitsysteme & zeitkritische Steuerarchitekturen\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eCluster\u003c\u002fb\u003e: Kommunikation & Systemarchitektur\u003cbr\u003e\u003cb\u003eBeschreibung\u003c\u002fb\u003e: Motivation: Regelkreise autonomer Systeme \u2013 von der Fahrzeugstabilisierung \u00fcber\u003cbr\u003eDrohnenflugsteuerung bis zur kollaborativen Robotik \u2013 erfordern garantierte\u003cbr\u003eReaktionszeiten im Millisekundenbereich; eine einzige Frist\u00fcberschreitung kann\u003cbr\u003eden Regelkreis zum Zusammenbruch bringen und damit direkt sicherheitskritische\u003cbr\u003eFolgen haben. Mit wachsender Systemkomplexit\u00e4t und zunehmend KI-basierten\u003cbr\u003eRegelungsanteilen ger\u00e4t die Vorhersagbarkeit des Worst-Case-Verhaltens unter\u003cbr\u003eerheblichen Druck \u2013 ein zentrales, noch ungel\u00f6stes Problem in der Entwicklung\u003cbr\u003eautonomer Plattformen.\u003cbr\u003e\u003cbr\u003eL\u00f6sungsans\u00e4tze: Time-Sensitive-Networking-Protokolle reservieren im Datennetz\u003cbr\u003egarantierte Zeitschlitze f\u00fcr sicherheitskritische Steuerdaten, sodass auch bei\u003cbr\u003ehoher Systemauslastung deterministische \u00dcbertragungszeiten eingehalten \u2026","\u003cb\u003eSoftware-Architekturen & Middleware f\u00fcr autonome Systeme\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eCluster\u003c\u002fb\u003e: Kommunikation & Systemarchitektur\u003cbr\u003e\u003cb\u003eBeschreibung\u003c\u002fb\u003e: Motivation: Autonome Systeme bestehen aus Dutzenden bis Hunderten von\u003cbr\u003eSoftwarekomponenten verschiedener Hersteller und Entwicklungsteams, die\u003cbr\u003ezuverl\u00e4ssig interagieren m\u00fcssen \u2013 ohne eine standardisierte Middleware-Schicht\u003cbr\u003eist diese Integration fehleranf\u00e4llig, kostenintensiv und kaum zertifizierbar.\u003cbr\u003eGesellschaftlich bedeutsam ist dies, weil fehlende Software-Interoperabilit\u00e4t\u003cbr\u003eheute einen der gr\u00f6\u00dften Engp\u00e4sse bei der Industrialisierung autonomer Systeme\u003cbr\u003edarstellt und damit den gesellschaftlichen Nutzen verz\u00f6gert.\u003cbr\u003e\u003cbr\u003eL\u00f6sungsans\u00e4tze: Offene Middlewareplattformen wie das Robot Operating System 2\u003cbr\u003eund fahrzeugspezifische Standards entkoppeln Anwendungssoftware von der\u003cbr\u003ezugrundeliegenden Hardware und schaffen standardisierte Kommunikations-,\u003cbr\u003eAusf\u00fchrungs- und Ressourcenverwaltungsdienste f\u00fcr \u2026","\u003cb\u003eSatellitenkommunikation f\u00fcr mobile Systeme\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eCluster\u003c\u002fb\u003e: Kommunikation & Systemarchitektur\u003cbr\u003e\u003cb\u003eBeschreibung\u003c\u002fb\u003e: Motivation: Terrestrische Mobilfunknetze decken trotz Ausbau weite Teile der\u003cbr\u003eErdoberfl\u00e4che nicht ab \u2013 abgelegene l\u00e4ndliche Regionen, maritime Routen,\u003cbr\u003eBerggebiete und Polarregionen bleiben weitgehend unkonnektiert, was den Einsatz\u003cbr\u003eautonomer Systeme in diesen R\u00e4umen strukturell verhindert und Gesellschaften von\u003cbr\u003edigitalen Diensten ausschlie\u00dft. Satellitennetzwerke in niedrigen Erdumlaufbahnen\u003cbr\u003ebieten erstmals eine realistische Perspektive auf globale, latenzarme\u003cbr\u003eBreitbandkonnektivit\u00e4t, die f\u00fcr sicherheitsrelevante Steuerungsanwendungen\u003cbr\u003emobiler Plattformen grundlegend geeigneter ist als geostation\u00e4re Systeme.\u003cbr\u003e\u003cbr\u003eL\u00f6sungsans\u00e4tze: Hybride terrestrisch-satellitengest\u00fctzte Netzarchitekturen\u003cbr\u003ekombinieren Mobilfunk der f\u00fcnften Generation f\u00fcr latenz- und\u003cbr\u003ebandbreitenkritische Nahbereichsanwendungen mit \u2026","\u003cb\u003eDatenschutz & Privatheit in vernetzten Mobilit\u00e4tssystemen\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eCluster\u003c\u002fb\u003e: Kommunikation & Systemarchitektur\u003cbr\u003e\u003cb\u003eBeschreibung\u003c\u002fb\u003e: Motivation: Vernetzte Mobilit\u00e4tssysteme erzeugen kontinuierlich pr\u00e4zise\u003cbr\u003eBewegungsprofile aller Verkehrsteilnehmer \u2013 Fahrzeuge, Fahrr\u00e4der, Fu\u00dfg\u00e4nger \u2013,\u003cbr\u003edie zu den sensibelsten personenbezogenen Daten z\u00e4hlen, weil aus ihnen Wohn- und\u003cbr\u003eArbeitsorte, soziale Kontakte, Gesundheitszust\u00e4nde und Verhaltensroutinen\u003cbr\u003erekonstruierbar sind. Das gesellschaftliche Vertrauen in vernetzte\u003cbr\u003eMobilit\u00e4tssysteme und deren breite Akzeptanz h\u00e4ngen unmittelbar davon ab, ob\u003cbr\u003edieser Datenschutz technisch und organisatorisch glaubw\u00fcrdig gew\u00e4hrleistet\u003cbr\u003ewerden kann.\u003cbr\u003e\u003cbr\u003eL\u00f6sungsans\u00e4tze: Pseudonymisierung durch regelm\u00e4\u00dfig wechselnde Zertifikate\u003cbr\u003everhindert die langfristige Verfolgung einzelner Fahrzeuge in Fahrzeug-Umgebung-\u003cbr\u003eKommunikationsnetzen, indem keine persistente Identit\u00e4t \u00fcber\u003cbr\u003eKommunikationsereignisse hinweg aufgebaut \u2026"],"legendgroup":"Kommunikation & Systemarchitektur","marker":{"color":"#2b81f5","line":{"color":"#2b81f5","width":80.0},"opacity":0.8,"size":140.0,"symbol":"line-ew"},"mode":"markers+text","name":"Kommunikation & Systemarchitektur","showlegend":true,"text":["Mobilfunknetze der\u003cbr\u003ef\u00fcnften und sechsten\u003cbr\u003eGeneration f\u00fcr mobile\u003cbr\u003eSysteme","Systemintegration &\u003cbr\u003eInteroperabilit\u00e4t\u003cbr\u003eheterogener\u003cbr\u003ePlattformen","Deterministische\u003cbr\u003eEchtzeitsysteme &\u003cbr\u003ezeitkritische\u003cbr\u003eSteuerarchitekturen","Software-Architekturen\u003cbr\u003e& Middleware f\u00fcr\u003cbr\u003eautonome Systeme","Satellitenkommunikatio\u003cbr\u003en f\u00fcr mobile Systeme","Datenschutz &\u003cbr\u003ePrivatheit in\u003cbr\u003evernetzten\u003cbr\u003eMobilit\u00e4tssystemen"],"textfont":{"color":"white","family":"Arial","size":15},"textposition":"middle center","x":[65.52828683926062,76.44051124008256,57.13295971832765,67.08813131494158,57.14030752109095,20.613737669955924],"y":[46.72446385347239,19.3279808839504,11.640424445944618,22.868177168878653,52.168892469769794,28.384571119449944],"type":"scatter"},{"hoverinfo":"text","hoverlabel":{"align":"left","bgcolor":"white","bordercolor":"#cccccc","font":{"color":"#222222","size":11},"namelength":0},"hovertext":["\u003cb\u003eFunktionale Sicherheit: Methodik & Sicherheitsnachweis\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eCluster\u003c\u002fb\u003e: Sicherheit & Zulassung & Recht\u003cbr\u003e\u003cb\u003eBeschreibung\u003c\u002fb\u003e: Motivation: Funktionale Sicherheit beschreibt die Abwesenheit unvertretbarer\u003cbr\u003eRisiken durch Fehlfunktionen elektrischer und elektronischer Systeme \u2013 in\u003cbr\u003eautonomen Mobilit\u00e4tssystemen ist diese Eigenschaft keine optionale\u003cbr\u003eQualit\u00e4tsstufe, sondern notwendige Bedingung daf\u00fcr, dass Systeme ohne permanente\u003cbr\u003emenschliche \u00dcberwachung betrieben werden d\u00fcrfen. Da sicherheitsrelevante\u003cbr\u003eSystemausf\u00e4lle seltene Ereignisse sind und statistisch kaum als\u003cbr\u003eNachweisgrundlage taugen, braucht es strukturierte Methoden zur Ableitung,\u003cbr\u003eKlassifikation und Verifikation von Sicherheitsanforderungen bereits in der\u003cbr\u003eEntwicklung.\u003cbr\u003e\u003cbr\u003eL\u00f6sungsans\u00e4tze: Gefahren- und Risikoanalysen nach ISO 26262 und verwandten\u003cbr\u003eNormen ordnen jeder sicherheitsrelevanten Funktion einen Automotive Safety\u003cbr\u003eIntegrity Level zu, der den normativen \u2026","\u003cb\u003eTypzulassung & regulatorischer Rahmen autonomer Systeme\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eCluster\u003c\u002fb\u003e: Sicherheit & Zulassung & Recht\u003cbr\u003e\u003cb\u003eBeschreibung\u003c\u002fb\u003e: Motivation: Selbst technologisch ausgereifte autonome Systeme k\u00f6nnen ihren\u003cbr\u003egesellschaftlichen Nutzen \u2013 Unfallreduktion, Mobilit\u00e4tszugang, Effizienzgewinn \u2013\u003cbr\u003eerst dann entfalten, wenn sie eine formal erteilte Betriebserlaubnis erhalten;\u003cbr\u003ebestehende Zulassungsrahmen wurden jedoch f\u00fcr von Menschen gesteuerte Systeme\u003cbr\u003eentwickelt und sind auf hochautomatisierte, lernf\u00e4hige Plattformen strukturell\u003cbr\u003enicht \u00fcbertragbar. Dieser regulatorische Engpass bremst Innovationszyklen,\u003cbr\u003ebindet Entwicklungskapazit\u00e4ten in aufw\u00e4ndige Einzelfallgenehmigungen und\u003cbr\u003everz\u00f6gert volkswirtschaftlich wie gesellschaftlich bedeutsame\u003cbr\u003eEinf\u00fchrungsszenarien.\u003cbr\u003e\u003cbr\u003eL\u00f6sungsans\u00e4tze: Neue Zulassungsrahmen \u2013 wie das deutsche Gesetz zum autonomen\u003cbr\u003eFahren und die europ\u00e4ischen Drohnenverordnungen \u2013 f\u00fchren\u003cbr\u003ebetriebsbereichsbasierte \u2026","\u003cb\u003eGesellschaftliche Akzeptanz & Ethik autonomer Mobilit\u00e4t\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eCluster\u003c\u002fb\u003e: Sicherheit & Zulassung & Recht\u003cbr\u003e\u003cb\u003eBeschreibung\u003c\u002fb\u003e: Motivation: Technologische Reife allein reicht nicht f\u00fcr die gesellschaftliche\u003cbr\u003eEinf\u00fchrung autonomer Systeme \u2013 empirische Studien zeigen, dass Menschen den\u003cbr\u003eEinsatz autonomer KI-Systeme selbst dann moralisch kritischer bewerten als\u003cbr\u003emenschliches Handeln, wenn die technische Leistungsf\u00e4higkeit objektiv h\u00f6her ist,\u003cbr\u003ewas auf tief verwurzelte Akzeptanzbarrieren jenseits der Systemperformanz\u003cbr\u003ehinweist. Ungekl\u00e4rte Haftungsfragen und fehlende normative Vorgaben f\u00fcr\u003cbr\u003ealgorithmische Entscheidungen in Konfliktsituationen gef\u00e4hrden dabei nicht nur\u003cbr\u003edie \u00f6ffentliche Akzeptanz, sondern auch die rechtliche Einf\u00fchrungsf\u00e4higkeit der\u003cbr\u003eTechnologien.\u003cbr\u003e\u003cbr\u003eL\u00f6sungsans\u00e4tze: Ethikkommissionen und maschinenethische Leitlinien \u2013 wie die\u003cbr\u003edeutschen Ethik-Regeln f\u00fcr automatisiertes Fahren \u2013 \u00fcbersetzen gesellschaftliche\u003cbr\u003eWerte wie \u2026"],"legendgroup":"Sicherheit & Zulassung & Recht","marker":{"color":"#0818af","line":{"color":"#0818af","width":80.0},"opacity":0.8,"size":140.0,"symbol":"line-ew"},"mode":"markers+text","name":"Sicherheit & Zulassung & Recht","showlegend":true,"text":["Funktionale\u003cbr\u003eSicherheit: Methodik &\u003cbr\u003eSicherheitsnachweis","Typzulassung &\u003cbr\u003eregulatorischer Rahmen\u003cbr\u003eautonomer Systeme","Gesellschaftliche\u003cbr\u003eAkzeptanz & Ethik\u003cbr\u003eautonomer Mobilit\u00e4t"],"textfont":{"color":"white","family":"Arial","size":15},"textposition":"middle center","x":[45.571494825230594,57.424000580374226,48.820806074595595],"y":[32.40420673194047,25.438114355891337,20.34056158071182],"type":"scatter"},{"hoverinfo":"text","hoverlabel":{"align":"left","bgcolor":"white","bordercolor":"#cccccc","font":{"color":"#222222","size":11},"namelength":0},"hovertext":["\u003cb\u003eElektrische & wasserstoffbasierte Antriebe\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eCluster\u003c\u002fb\u003e: Energie & Nachhaltigkeit & Systemkontext\u003cbr\u003e\u003cb\u003eBeschreibung\u003c\u002fb\u003e: Motivation: Die Dekarbonisierung des Mobilit\u00e4tssektors \u2013 Stra\u00dfenverkehr,\u003cbr\u003eLuftfahrt, Landwirtschaft und maritime Anwendungen \u2013 erfordert einen\u003cbr\u003egrundlegenden Antriebswechsel weg von fossilen Brennstoffen; elektrische und\u003cbr\u003ewasserstoffbasierte Systeme sind dabei die technologisch vielversprechendsten\u003cbr\u003eAlternativen mit dem Potenzial zur vollst\u00e4ndigen Treibhausgasneutralit\u00e4t. F\u00fcr\u003cbr\u003eautonome Mobilit\u00e4tssysteme ist die Antriebsfrage dabei unmittelbar\u003cbr\u003ebetriebsrelevant: Energiedichte, Ladezeit und Systemgewicht bestimmen\u003cbr\u003eReichweite, Nutzlast und Einsatzdauer direkt.\u003cbr\u003e\u003cbr\u003eL\u00f6sungsans\u00e4tze: Lernbasierte Batteriezustands\u00fcberwachung kombiniert Sensorik mit\u003cbr\u003eneuronalen Netzen, um Degradationsprozesse in Echtzeit zu erkennen,\u003cbr\u003eRestlebensdauer zu prognostizieren und Lade- sowie Betriebsstrategien adaptiv zu\u003cbr\u003e\u2026","\u003cb\u003eRessourceneffizienz & nachhaltige Mobilit\u00e4t\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eCluster\u003c\u002fb\u003e: Energie & Nachhaltigkeit & Systemkontext\u003cbr\u003e\u003cb\u003eBeschreibung\u003c\u002fb\u003e: Motivation: Autonome und vernetzte Mobilit\u00e4tssysteme \u2013 vom Stra\u00dfenfahrzeug \u00fcber\u003cbr\u003eDrohnen bis zu autonomen Wasserfahrzeugen und Schienenfahrzeugen \u2013 versprechen\u003cbr\u003e\u00f6kologische Effizienzgewinne durch optimierte Betriebsf\u00fchrung, Kolonnenfahrt und\u003cbr\u003ereduzierte Leerfahrten; ob diese Potenziale die erheblichen Ressourcenlasten aus\u003cbr\u003eHerstellung und Betrieb tats\u00e4chlich \u00fcberwiegen, ist eine offene Forschungsfrage.\u003cbr\u003eEine vollst\u00e4ndige Lebenszyklusbetrachtung ist unerl\u00e4sslich, weil sensorintensive\u003cbr\u003eHardware, Batterien und KI-Infrastruktur erhebliche Material- und\u003cbr\u003eEnergieaufw\u00e4nde erzeugen, die erst \u00fcber hinreichend lange Nutzungsdauern\u003cbr\u003ekompensiert werden.\u003cbr\u003e\u003cbr\u003eL\u00f6sungsans\u00e4tze: Standardisierte Lebenszyklusanalysen quantifizieren\u003cbr\u003eTreibhausgasemissionen, Ressourcenverbrauch und \u00d6kotoxizit\u00e4t \u00fcber alle\u003cbr\u003eSystemphasen von \u2026","\u003cb\u003eKatastrophenschutz & Notfallrobotik\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eCluster\u003c\u002fb\u003e: Energie & Nachhaltigkeit & Systemkontext\u003cbr\u003e\u003cb\u003eBeschreibung\u003c\u002fb\u003e: Motivation: Naturkatastrophen, Industrieunf\u00e4lle und Altlastenkontaminationen \u2013\u003cbr\u003evon Munitionslagern in Gew\u00e4ssern bis zu kerntechnischen St\u00f6rf\u00e4llen \u2013 erzeugen\u003cbr\u003eLagen, in denen menschliche Einsatzkr\u00e4fte erheblichen Gesundheitsrisiken\u003cbr\u003eausgesetzt sind; robotische Systeme k\u00f6nnen in diesen Umgebungen Erkundung,\u003cbr\u003eKartierung und Bergung \u00fcbernehmen und damit Menschenleben sch\u00fctzen.\u003cbr\u003eGesellschaftlich gewinnt das Thema durch die zunehmende H\u00e4ufigkeit extremer\u003cbr\u003eWetterereignisse und den wachsenden Bestand an Altlasten wie\u003cbr\u003eMunitionsr\u00fcckst\u00e4nden in Nord- und Ostsee an Dringlichkeit.\u003cbr\u003e\u003cbr\u003eL\u00f6sungsans\u00e4tze: Heterogene Multi-Roboter-Teams aus Luftdrohnen zur Aufkl\u00e4rung\u003cbr\u003eund gel\u00e4ndeg\u00e4ngigen Bodenrobotern zur Manipulation kombinieren ihre\u003cbr\u003ekomplement\u00e4ren F\u00e4higkeiten unter menschlicher Aufsicht, wobei gemischte Schw\u00e4rme\u003cbr\u003e\u2026","\u003cb\u003eEnergie-Infrastruktur & intelligentes Mikronetz\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eCluster\u003c\u002fb\u003e: Energie & Nachhaltigkeit & Systemkontext\u003cbr\u003e\u003cb\u003eBeschreibung\u003c\u002fb\u003e: Motivation: Forschungsstandorte, Industrieareale und strukturschwache l\u00e4ndliche\u003cbr\u003eRegionen sind zunehmend bestrebt, ihre Energieversorgung unabh\u00e4ngig von\u003cbr\u003ezentralen Netzen zu gestalten \u2013 sowohl aus Resilienzgr\u00fcnden als auch um Ziele\u003cbr\u003eder Treibhausgasneutralit\u00e4t durch lokal erzeugte erneuerbare Energie zu\u003cbr\u003eerreichen. F\u00fcr Forschungs- und Testinfrastrukturen wie das SML kommt hinzu, dass\u003cbr\u003ehohe und volatile Lastspitzen durch Versuchsbetrieb, Ladeinfrastruktur und\u003cbr\u003eKlimatechnik eine autarke Energiesteuerung mit Kurz- und Langzeitspeicherung\u003cbr\u003etechnologisch besonders anspruchsvoll und wissenschaftlich attraktiv machen.\u003cbr\u003e\u003cbr\u003eL\u00f6sungsans\u00e4tze: Intelligente Mikronetze kombinieren Photovoltaik,\u003cbr\u003eBatteriespeicher und saisonale Wasserstoffspeicherung zu einem adaptiv\u003cbr\u003egesteuerten Energiesystem, das lokale Erzeugung, \u2026"],"legendgroup":"Energie & Nachhaltigkeit & Systemkontext","marker":{"color":"#0b84f3","line":{"color":"#0b84f3","width":80.0},"opacity":0.8,"size":140.0,"symbol":"line-ew"},"mode":"markers+text","name":"Energie & Nachhaltigkeit & Systemkontext","showlegend":true,"text":["Elektrische &\u003cbr\u003ewasserstoffbasierte\u003cbr\u003eAntriebe","Ressourceneffizienz &\u003cbr\u003enachhaltige Mobilit\u00e4t","Katastrophenschutz &\u003cbr\u003eNotfallrobotik","Energie-Infrastruktur\u003cbr\u003e& intelligentes\u003cbr\u003eMikronetz"],"textfont":{"color":"white","family":"Arial","size":15},"textposition":"middle center","x":[19.746711821180504,9.896854329305192,82.93641866221961,28.573318481445312],"y":[71.58944994985796,73.31580663077526,79.3347626067345,90.18485260009766],"type":"scatter"},{"hoverinfo":"text","hoverlabel":{"align":"left","bgcolor":"white","bordercolor":"#cccccc","font":{"color":"#222222","size":11},"namelength":0},"hovertext":["\u003cb\u003eVerkehrsmanagement & urbane Mobilit\u00e4tsoptimierung\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eCluster\u003c\u002fb\u003e: Mobilit\u00e4t im Systemkontext\u003cbr\u003e\u003cb\u003eBeschreibung\u003c\u002fb\u003e: Motivation: Wachsende Urbanisierung, steigende Fahrzeugdichten und der Ausbau\u003cbr\u003emultimodaler Verkehrssysteme erzeugen Steuerungskomplexit\u00e4ten, die mit\u003cbr\u003eklassischen regelbasierten Verkehrsmanagementsystemen nicht mehr beherrschbar\u003cbr\u003esind; gleichzeitig verursachen ineffiziente Verkehrsfl\u00fcsse erhebliche\u003cbr\u003eEmissionen, Zeitverluste und soziale Ungleichheiten beim Mobilit\u00e4tszugang.\u003cbr\u003eK\u00fcnstliche Intelligenz er\u00f6ffnet die M\u00f6glichkeit, Verkehrssteuerung nicht mehr\u003cbr\u003ereaktiv nach festen Programmen, sondern vorausschauend auf Basis von\u003cbr\u003eEchtzeitdaten und Prognosealgorithmen zu gestalten.\u003cbr\u003e\u003cbr\u003eL\u00f6sungsans\u00e4tze: Adaptive Lichtsignalsteuerung auf Basis best\u00e4rkenden Lernens\u003cbr\u003epasst Signalphasen kontinuierlich an das aktuelle Verkehrsaufkommen an und\u003cbr\u003eoptimiert dabei netzweite Ziele wie Durchsatz, Emissionen und Reisezeit \u2026","\u003cb\u003eMultimodale Integration & Systemarchitektur der Mobilit\u00e4t\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eCluster\u003c\u002fb\u003e: Mobilit\u00e4t im Systemkontext\u003cbr\u003e\u003cb\u003eBeschreibung\u003c\u002fb\u003e: Motivation: Klimaschutzziele und die Verkehrswende erfordern eine deutliche\u003cbr\u003eVerlagerung hin zu umweltvertr\u00e4glichen Verkehrstr\u00e4gern \u2013 dies gelingt nur, wenn\u003cbr\u003eBahn, Bus, Fahrrad, Sharing-Dienste, Fu\u00dfwege und k\u00fcnftige Luftmobilit\u00e4tsangebote\u003cbr\u003ezu attraktiven, nahtlosen Reiseketten verkn\u00fcpft werden, die das private Auto als\u003cbr\u003eStandardl\u00f6sung ersetzen k\u00f6nnen. Gerade in l\u00e4ndli
