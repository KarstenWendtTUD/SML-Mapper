ensing,\u003cbr\u003ecommunication and human sensor technologies, the aim is to improve the\u003cbr\u003eefficiency, safety, and effectiveness of emergency medical response and search\u003cbr\u003eand rescue operations, particularly in high-risk scenarios, such as wildfires,\u003cbr\u003eearthquakes and large-scale trauma events. Proposals should explore the design,\u003cbr\u003etesting, and validation of innovative solutions capable of performing critical\u003cbr\u003etasks in disaster-stricken areas. These technologies should be tailored to\u003cbr\u003eoperate in extreme \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 05.11.2026","\u003cb\u003eEnhanced Resilience in Multimodal Passenger Transport Through Digital Technologies and Generative and Discriminative AI\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding awarded under this cluster will support Europe's green transition based\u003cbr\u003eon competitive European industrial and service value chains, in particular in\u003cbr\u003ethe energy and mobility sector which represent markets that are predicted to\u003cbr\u003esubstantially grow globally.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Passenger transport systems are a critical component of urban, suburban and\u003cbr\u003elong-distance travel, facilitating connectivity, reducing traffic congestion and\u003cbr\u003esupporting environmental sustainability. However, these systems face challenges\u003cbr\u003esuch as operational disruptions, safety and security risks, and evolving\u003cbr\u003epassenger demands. In the context of passenger transport, resilience refers to\u003cbr\u003ethe ability of a transport system to absorb disturbances, maintain its basic\u003cbr\u003estructure and function, and recover to a required level of service within\u003cbr\u003eacceptable time and cost after being affected by disruption. This involves\u003cbr\u003eimplementing measures that ensure continuous operation, quick recovery from\u003cbr\u003eunexpected events and adaptability to changing circumstances. Enhanced\u003cbr\u003eresilience is essential for \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 08.10.2026","\u003cb\u003eEnergy Efficient Urban and Sub-Urban Public Transport, Complemented by Shared Mobility\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: This EU Mission aims to deliver 100 climate-neutral and smart cities by 2030\u003cbr\u003ewith a view to enabling all European cities to achieve climate neutrality by\u003cbr\u003e2050.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Public transport is firmly at the centre of sustainable urban mobility policies\u003cbr\u003eat EU level and across Member States, in complementarity with active mobility\u003cbr\u003eand shared mobility services. However more needs to be done to make sure that\u003cbr\u003eurban and suburban public passenger transport, including coaches, and urban\u003cbr\u003emobility service car fleets are energy efficient and attractive, contributing to\u003cbr\u003eclimate neutrality targets as well as to cleaner and healthier urban and sub-\u003cbr\u003eurban environments. In addition, an optimal integration of public transport with\u003cbr\u003eother\u002fnew shared mobility services can increase its uptake by offering services\u003cbr\u003ethat are complementary, offering coherent solutions allowing interconnection\u003cbr\u003ebetween mass transit and 'last-mile' solutions. Designing urban and sub-urban\u003cbr\u003esystems that \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 08.10.2026","\u003cb\u003eIncreasing Competitiveness and Resilience of Multimodal Freight Transport and Logistics for Competitive Supply Chains\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding awarded under this cluster will support Europe's green transition based\u003cbr\u003eon competitive European industrial and service value chains, in particular in\u003cbr\u003ethe energy and mobility sector which represent markets that are predicted to\u003cbr\u003esubstantially grow globally.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Freight transport demand in Europe is expected to double in the coming decades,\u003cbr\u003emaking it essential to enhance the capacity, efficiency and resilience of\u003cbr\u003efreight transport to maintain the European competitiveness. Despite policy goals\u003cbr\u003eto strengthen multimodal transport, double rail freight's share by 2050, and\u003cbr\u003eincrease transport by inland waterways and short sea shipping by 50% by 2050,\u003cbr\u003eunimodal road transport remains more competitive, and the growth of multimodal\u003cbr\u003efreight has been limited. The lack of integration of rail, inland waterways and\u003cbr\u003emultimodal data into logistics and supply chain solutions is one of the main\u003cbr\u003ebarriers, hindering the efficient and competitive adoption of multimodality.\u003cbr\u003eFurthermore, improving system resilience requires better tools and solutions for\u003cbr\u003emultimodal \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 08.10.2026","\u003cb\u003eAdvanced Border Surveillance and Situational Awareness\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding to support European research and innovation to enhance cybersecurity and\u003cbr\u003econtribute to the resilience of digital infrastructures and their ability to\u003cbr\u003esupply and provide services, as well as the security and safety of all producers\u003cbr\u003eand users.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Capabilities for situational awareness and surveillance of land and sea borders\u003cbr\u003eneed improvement, in consideration of potential future challenges that may\u003cbr\u003erequire updated capabilities. These challenges may include potential future\u003cbr\u003elarge-scale movements of people across external borders, resulting from future\u003cbr\u003eattempts to instrumentalisation of irregular migration, but also from conflicts,\u003cbr\u003esocial, economic, environmental and climate stress in the European\u003cbr\u003eneighbourhood; as well as increasing availability and capability of unmanned\u003cbr\u003eaerial, surface, and underwater vehicles with increased payload capacity and\u003cbr\u003erange that make it easier to transport goods and, possibly, persons, including\u003cbr\u003ein connection will illicit or illegal activities such as trafficking of goods\u003cbr\u003eand smuggling of people across \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 05.11.2026","\u003cb\u003eClimate Security and Civil Preparedness - New Ways to Develop Pre- and Post-Crisis Climate-Change Related Scenarios for a More Resilient Europe\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding to support European research and innovation to enhance cybersecurity and\u003cbr\u003econtribute to the resilience of digital infrastructures and their ability to\u003cbr\u003esupply and provide services, as well as the security and safety of all producers\u003cbr\u003eand users.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Climate change is a global challenge with profound security implications at the\u003cbr\u003eglobal, regional, and local levels. It exacerbates risks across multiple\u003cbr\u003esectors, including agriculture, biodiversity, health, border security, economy,\u003cbr\u003efinancial stability, transport, telecommunication and human displacement,\u003cbr\u003eleading to severe socio-economic consequences and destabilising communities. The\u003cbr\u003eincreasing frequency and intensity of climate-related disasters highlight the\u003cbr\u003eurgent need for a holistic, long-term strategy to address climate security,\u003cbr\u003eintegrating risk assessment, crisis management, and adaptation measures, while\u003cbr\u003ealso leveraging the expertise of the insurance sector. While climate services\u003cbr\u003ebased on data analysis have reached a high level of trust among users, their\u003cbr\u003eapplication to civil \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 05.11.2026","\u003cb\u003eGenerative AI for Smarter CCAM: Enhancing Perception, Decision-Making, and Validation (CCAM Partnership)\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding awarded under this cluster will support Europe's green transition based\u003cbr\u003eon competitive European industrial and service value chains, in particular in\u003cbr\u003ethe energy and mobility sector which represent markets that are predicted to\u003cbr\u003esubstantially grow globally.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Pilots and demonstrations using Level 3 and 4 vehicle services face major\u003cbr\u003echallenges in perception and decision making, highlighting the necessity for\u003cbr\u003elow-latency solutions that enhance responsiveness and situational awareness in\u003cbr\u003ereal-time operating conditions. This is especially relevant for driving in more\u003cbr\u003ecomplex environments like urban areas, where environmental variance is higher\u003cbr\u003eand where new scenarios can be regularly encountered. Furthermore, there is the\u003cbr\u003eneed to limit the latency, bandwidth and energy use for on-board calculations,\u003cbr\u003eas well as the need to enhance the security, privacy and reliability (eg scene\u003cbr\u003eunderstanding and prediction of near-future scenario development). For rapid\u003cbr\u003edecision-making in interactions with VRUs, this is essential for implementing\u003cbr\u003eCCAM-enabled \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 08.10.2026","\u003cb\u003eTools and Processes to Support Stress Tests of Critical Infrastructure\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding to support European research and innovation to enhance cybersecurity and\u003cbr\u003econtribute to the resilience of digital infrastructures and their ability to\u003cbr\u003esupply and provide services, as well as the security and safety of all producers\u003cbr\u003eand users.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: The resilience of critical entities is of paramount importance as disruptions to\u003cbr\u003ethese systems can have significant consequences for the whole economy, public\u003cbr\u003ehealth, security or safety. These systems, responsible for providing essential\u003cbr\u003eservices for modern society, are increasingly complex and interconnected, making\u003cbr\u003ethem vulnerable to a range of threats, including cyber-attacks, physical\u003cbr\u003eattacks, malfunctions, human-induced or natural disasters. The objective of this\u003cbr\u003etopic is to facilitate the stress testing of critical infrastructure by\u003cbr\u003eproviding specialised tools and methodologies and support validation. This will\u003cbr\u003eenable the identification and testing of technical and operational\u003cbr\u003evulnerabilities, inform of effective solutions to mitigate these risks, and\u003cbr\u003efacilitate the collection and \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 05.11.2026","\u003cb\u003eSecurity Challenges of the Green Transition in Urban and Peri Urban Areas\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding to support European research and innovation to enhance cybersecurity and\u003cbr\u003econtribute to the resilience of digital infrastructures and their ability to\u003cbr\u003esupply and provide services, as well as the security and safety of all producers\u003cbr\u003eand users.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Climate change and environmental degradation are an existential threat to the\u003cbr\u003eworld, and the green transition is a critical component of the EU's strategy to\u003cbr\u003ereduce and mitigate their impacts, as well as to contribute to the European\u003cbr\u003ecompetitiveness. This approach is also part of the effort to transform Europe\u003cbr\u003einto a modern, resource-efficient, resilient and competitive economy. However,\u003cbr\u003erapid deployment of new and emerging technologies, such as, but not limited to:\u003cbr\u003egreen and grid-interactive roofs and walls, solar power installations, electric\u003cbr\u003evehicle charging stations, energy storages, smart sensors and surveillance\u003cbr\u003esystems, green transportation systems, nature-based or other sustainable or\u003cbr\u003ereused construction materials, or specific infrastructure solutions may create\u003cbr\u003esecurity risks \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 05.11.2026","\u003cb\u003eOpen Topic on Preventing and Countering the Misuse of Emerging Technologies for Criminal Purposes, Including Issues Related to Lawful Access to Data\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding to support European research and innovation to enhance cybersecurity and\u003cbr\u003econtribute to the resilience of digital infrastructures and their ability to\u003cbr\u003esupply and provide services, as well as the security and safety of all producers\u003cbr\u003eand users.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: New and emerging technologies (eg, new communication technologies, quantum\u003cbr\u003etechnologies, new biometrics and identification technologies, cloud computing\u003cbr\u003etechnologies, generative AI etc) bring many benefits but also pose a number of\u003cbr\u003enew challenges for the police and the judiciary. Therefore, there is a strong\u003cbr\u003eneed to adequately tackle challenges for Police Authorities stemming from all\u003cbr\u003ethese new and emerging developments as well as to make sure that the lawful\u003cbr\u003eaccess to data keeps track with these evolutions, respecting applicable\u003cbr\u003elegislation and fundamental rights such as personal data protection and privacy.\u003cbr\u003eUnder the Open topic, proposals are welcome to address new and emerging\u003cbr\u003etechnologies that are not covered by the other projects of the previous Horizon\u003cbr\u003eEurope Calls Fighting Crime \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 05.11.2026","\u003cb\u003eTargeted Innovative Capabilities for the Resilience of Critical Entities to Natural and Human-Induced Disasters, Including Hybrid Scenarios\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding to support European research and innovation to enhance cybersecurity and\u003cbr\u003econtribute to the resilience of digital infrastructures and their ability to\u003cbr\u003esupply and provide services, as well as the security and safety of all producers\u003cbr\u003eand users.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Recent compound and cascading disasters have demonstrated the urgent need to\u003cbr\u003ereinforce the resilience of critical entities against a wide spectrum of\u003cbr\u003ehazards, including both human-induced incidents, natural events such as floods,\u003cbr\u003ewildfires, earthquakes, and storms, and natural hazard triggered technological\u003cbr\u003e(NaTech) accidents, including hybrid scenarios. The vulnerability of key\u003cbr\u003einfrastructures is exacerbated by their growing interdependencies and the\u003cbr\u003esystemic propagation of risks across sectors and borders. In this context,\u003cbr\u003eensuring the monitoring, protection and continuity of essential services has\u003cbr\u003ebecome fundamental to preserving and enhancing societal resilience. This topic\u003cbr\u003eaims to support the development and demonstration of targeted high-tech\u003cbr\u003ecapabilities that address specific \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 05.11.2026","\u003cb\u003eFlagship-Pilot: Large-Scale Demonstrations of CCAM (CCAM Partnership)\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding awarded under this cluster will support Europe's green transition based\u003cbr\u003eon competitive European industrial and service value chains, in particular in\u003cbr\u003ethe energy and mobility sector which represent markets that are predicted to\u003cbr\u003esubstantially grow globally.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: CCAM solutions are expected to provide a more user-centred, inclusive mobility\u003cbr\u003esystem that enhances safety, reduces congestion, lowers harmful emissions and\u003cbr\u003econtributes to decarbonisation. In addition, CCAM solutions enhance transport\u003cbr\u003eeffectiveness, thereby strengthening Europe's competitiveness in the global\u003cbr\u003emobility sector. Novel mobility services can enable seamless integration with\u003cbr\u003eexisting services such as public transport and logistics, while higher levels of\u003cbr\u003eautomation are expected to boost transport productivity and efficiency. However,\u003cbr\u003ethe benefits of these solutions must be proven through large-scale\u003cbr\u003edemonstrations, validating their effectiveness for both people and goods. It is\u003cbr\u003ealso of key importance to integrate and test enabling vehicle technologies and\u003cbr\u003eto validate trusted \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 08.10.2026","\u003cb\u003eNew Technologies and Innovation: Digitalisation of Road Transport - Works\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding instrument to realise European transport infrastructure policy. It aims\u003cbr\u003eat supporting investments in building new transport infrastructure in Europe or\u003cbr\u003erehabilitating and upgrading existing infrastructure.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: The objective of this call is to modernise transport infrastructure and enhance\u003cbr\u003ethe digitalisation of road transport on the TEN-T network. This topic will\u003cbr\u003esupport works related to projects fostering the deployment of new technologies\u003cbr\u003eand innovation by supporting test-beds\u002finfrastructure for autonomous vehicles.\u003cbr\u003eThe focus will be specifically on investments in infrastructure for commercial\u003cbr\u003e(pre-)deployment of autonomous vehicles, implementing sufficiently mature\u003cbr\u003etechnology that do not include Research & Innovation activities. The projects to\u003cbr\u003ebe financed shall contribute to the deployment of highly automated vehicles on\u003cbr\u003ethe road for real operation, requiring investment in infrastructure to ensure\u003cbr\u003ethe efficient operation of autonomous vehicles, in two areas:      Establishing\u003cbr\u003econtrol centres \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 06.10.2026","\u003cb\u003eEIC Pathfinder Challenge: Advanced Materials for Miniaturised Energy Harvesting Systems\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding via the European Innovation Council to support research into new and\u003cbr\u003edeep-tech areas to develop the groundbreaking technologies needed to enhance\u003cbr\u003eEurope's innovative capacities.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: The exponential rise in the development and deployment of IoT (Internet of\u003cbr\u003eThings) systems and of connected objects (~100 billion by 2025 and ~250 billion\u003cbr\u003eby 2030) will in turn increase the number of sensor networks required to provide\u003cbr\u003edata on the ground, with estimates pointing to ~1Trillion by 2025 and ~10\u003cbr\u003etrillion by 2040. A consequence of such an expansion is a commensurate increase\u003cbr\u003ein energy consumption coupled with detrimental impacts on environmental\u003cbr\u003esustainability: studies point to the total electricity consumed by IoTs in 2040,\u003cbr\u003eequalling total global energy consumption at present. Moreover, the sensor\u003cbr\u003enetworks, generally powered by batteries, will result in 80 million batteries\u003cbr\u003ehaving to be changed each day, with knock-on effects on the wider environment.\u003cbr\u003eMitigating the impact of \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 28.10.2026","\u003cb\u003eMulti-Hazard Approach and Cumulative\u002fCascading Impacts\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding to support European research and innovation to enhance cybersecurity and\u003cbr\u003econtribute to the resilience of digital infrastructures and their ability to\u003cbr\u003esupply and provide services, as well as the security and safety of all producers\u003cbr\u003eand users.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Advancing multi-hazard risk assessment and disaster resilience is a necessity.\u003cbr\u003eBuilding on the integrated all-hazard approach, the advancement will be achieved\u003cbr\u003eby integrating single-hazard models into next-generation predictive systems\u003cbr\u003ecapable of analysing cascading and cumulative effects. A key focus should be on\u003cbr\u003eearly and anticipatory action, improving the understanding of interactions\u003cbr\u003ebetween meteorological, geophysical, and technological hazards, including their\u003cbr\u003ecompounding impacts on societies, economies, and critical infrastructure.\u003cbr\u003eProposals should aim to develop and validate integrated forecasting models, that\u003cbr\u003eenhance the prediction and management of multi-hazard scenarios, supports\u003cbr\u003eflexibility and extensibility, and coordination of responses by incorporating\u003cbr\u003ereal-time data, \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 05.11.2026","\u003cb\u003eDeepRAP: Deep Reasoning, Abstraction & Planning Towards Trustworthy Cognitive AI Systems\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding via the European Innovation Council to support research into new and\u003cbr\u003edeep-tech areas to develop the groundbreaking technologies needed to enhance\u003cbr\u003eEurope's innovative capacities.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Artificial Intelligence (AI) systems have achieved remarkable progress as\u003cbr\u003eevidenced by the ability of Generative AI (GenAI) to recognise patterns and\u003cbr\u003egenerate contextually relevant outputs based on ever larger models and\u003cbr\u003eassociated datasets. However, despite the remarkable strides made over the past\u003cbr\u003edecade, there remains a significant gap between the capabilities of the human\u003cbr\u003ebrain and machine intelligence, which must be overcome to achieve robust\u003cbr\u003eperformance and enable effective interactions with users and stakeholders.\u003cbr\u003eCurrent GenAI models can release very accurate outputs and even solve some\u003cbr\u003emathematical problems but might struggle with some complex reasoning benchmarks\u003cbr\u003eand to understand the real world. These models frequently fail to reliably solve\u003cbr\u003elogic tasks and long-term planning, \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 28.10.2026","\u003cb\u003eOpen Topic on Supporting Disruptive Technological Innovations for Civil Security\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding to support European research and innovation to enhance cybersecurity and\u003cbr\u003econtribute to the resilience of digital infrastructures and their ability to\u003cbr\u003esupply and provide services, as well as the security and safety of all producers\u003cbr\u003eand users.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: This topic aims to support the integration of disruptive technological\u003cbr\u003einnovations into civil security by strengthening research and innovation\u003cbr\u003eactivities that enhance preparedness, response capabilities, and risk\u003cbr\u003emitigation. A key focus is bridging the gap between early-stage, low Technology\u003cbr\u003eReadiness Level (TRL) research and applied security solutions, ensuring that\u003cbr\u003eemerging technologies are effectively transitioned into operational use.\u003cbr\u003eProposals should prioritise disruptive solutions that address diverse security\u003cbr\u003ethreats while improving the efficiency and effectiveness of civil security\u003cbr\u003eoperations. Emphasis should be placed on ensuring that these technologies are\u003cbr\u003erobust, reliable, scalable, and aligned with the needs of security\u003cbr\u003epractitioners. This includes fostering a structured \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 05.11.2026","\u003cb\u003eDesigning New Ways of Risk Awareness and Enhanced Disaster Preparedness\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding to support European research and innovation to enhance cybersecurity and\u003cbr\u003econtribute to the resilience of digital infrastructures and their ability to\u003cbr\u003esupply and provide services, as well as the security and safety of all producers\u003cbr\u003eand users.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Building on the whole-of-society and whole-of-government approach, this topic\u003cbr\u003eshould contribute to enhancing risk awareness and disaster preparedness through\u003cbr\u003ethe development of innovative tools, methodologies, and frameworks. A key focus\u003cbr\u003eshould be on integrating diverse societal and resilience perspectives\u003cbr\u003econsidering people in a vulnerable situation, ensuring inclusive participation\u003cbr\u003ein risk communication strategies, and leveraging accessible advanced\u003cbr\u003etechnologies and processes to improve public understanding of hazards and\u003cbr\u003evulnerabilities (such as gender, disabilities and other social factors) and\u003cbr\u003ecapabilities. Efforts should aim at designing and validating novel approaches to\u003cbr\u003erisk perception, communication, including digital platforms, immersive\u003cbr\u003etechnologies, and participatory tools \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 05.11.2026","\u003cb\u003eImproving Capabilities of Law Enforcement to Counter Climate-Related Challenges\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding to support European research and innovation to enhance cybersecurity and\u003cbr\u003econtribute to the resilience of digital infrastructures and their ability to\u003cbr\u003esupply and provide services, as well as the security and safety of all producers\u003cbr\u003eand users.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Global climate change is a megatrend expected to affect all societies over the\u003cbr\u003enext decade. As stated in 'Germany: National interdisciplinary climate risk\u003cbr\u003eassessment', 'We are already living in the climate crisis. This brings\u003cbr\u003esubstantial security risks at global and national levels... Anyone thinking\u003cbr\u003eabout security needs to think about climate as well'. Climate change will affect\u003cbr\u003eEuropean law enforcement in various ways. Notably, it is likely to create new\u003cbr\u003eopportunities and resources for organised crime, challenging current security\u003cbr\u003eframeworks. One of the expected outcomes of climate change will be the emergence\u003cbr\u003eof scarcity markets. Links between resource scarcity propelled by climate change\u003cbr\u003eand the crime opportunities for organised crime groups need to be further\u003cbr\u003eanalysed. Criminal \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 05.11.2026","\u003cb\u003eOpen Topic on Driving Innovation Uptake of Disaster Risk Solutions\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding to support European research and innovation to enhance cybersecurity and\u003cbr\u003econtribute to the resilience of digital infrastructures and their ability to\u003cbr\u003esupply and provide services, as well as the security and safety of all producers\u003cbr\u003eand users.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: This topic aims to foster the widespread adoption and integration of high-TRL\u003cbr\u003e(Technology Readiness Level) disaster risk solutions (DRS) across multiple\u003cbr\u003esectors, enhancing societal resilience to various hazards, including climate.\u003cbr\u003eThe focus is on overcoming barriers to deployment, ensuring accessibility, and\u003cbr\u003estrengthening collaboration among stakeholders to drive innovation uptake.\u003cbr\u003eProjects should promote the adoption of high-TRL solutions by public and private\u003cbr\u003esector organisations involved in disaster risk management, developing strategies\u003cbr\u003efor scaling and commercialising innovative DRS technologies to ensure they reach\u003cbr\u003eend-users efficiently. They should also demonstrate how these technologies can\u003cbr\u003ecomplement or replace existing disaster preparedness, response, and recovery\u003cbr\u003eframeworks by \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 05.11.2026","\u003cb\u003eSupporting Sustainable and Smart Urban Mobility in Europe (CIVITAS)\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding awarded under this cluster will support Europe's green transition based\u003cbr\u003eon competitive European industrial and service value chains, in particular in\u003cbr\u003ethe energy and mobility sector which represent markets that are predicted to\u003cbr\u003esubstantially grow globally.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Effective and efficient urban mobility systems are the backbone of competitive\u003cbr\u003ecities, without them the economy comes to a standstill. While cities are going\u003cbr\u003ethrough a rapid digital, green and social transformation, local and regional\u003cbr\u003eauthorities play bigger roles and take on greater responsibilities in\u003cbr\u003econtributing to the prosperity, climate-neutrality and competitiveness of the\u003cbr\u003eEuropean Union. However, the deployment of innovative sustainable mobility\u003cbr\u003esolutions has been hampered by fragmentation of the support to cities at\u003cbr\u003eregional, national and EU level, lack of resources for experimentation with new\u003cbr\u003eapproaches, insufficient knowledge on research results and innovative solutions,\u003cbr\u003eand difficulties for urban stakeholders to exchange knowledge, experiences and\u003cbr\u003elessons learned, including \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 08.10.2026","\u003cb\u003eRoad Safety and Resilience of Rural Areas\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding awarded under this cluster will support Europe's green transition based\u003cbr\u003eon competitive European industrial and service value chains, in particular in\u003cbr\u003ethe energy and mobility sector which represent markets that are predicted to\u003cbr\u003esubstantially grow globally.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: With more than 50% of all EU road fatalities occurring in rural areas along with\u003cbr\u003eevidence suggesting that crashes and crash-related fatalities in rural roads\u003cbr\u003evary from those in urban roads or motorways, it is imperative to understand and\u003cbr\u003emitigate the safety risks in rural roads in view of the EU's ambition to move\u003cbr\u003etowards Vision Zero by 2050. Local and regional authorities have an important\u003cbr\u003erole to play to reduce road fatalities and serious injuries. In the EU, the\u00a0Road\u003cbr\u003eInfrastructure Safety Management (RISM) Directive\u00a0introduced the concept of\u003cbr\u003enetwork-wide road safety assessment (NWRSA) and the concept of proactive road\u003cbr\u003esafety assessment through the understanding of the in-built safety of roads.\u003cbr\u003eConsidering safety at the network-level allows for an overview of the road\u003cbr\u003esafety performance \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 08.10.2026","\u003cb\u003eDevelopment of Ecosystem and Next-Generation Capabilities for a Secured European Critical Communication System in Civil Security\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding to support European research and innovation to enhance cybersecurity and\u003cbr\u003econtribute to the resilience of digital infrastructures and their ability to\u003cbr\u003esupply and provide services, as well as the security and safety of all producers\u003cbr\u003eand users.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: The European Union Critical Communication System (EUCCS) is a flagship\u003cbr\u003einitiative aiming at gradual development of a unified, secure, and interoperable\u003cbr\u003ecommunication infrastructure to support critical public safety and civil\u003cbr\u003esecurity operations across Europe. It aims to provide law enforcement, first\u003cbr\u003eresponders, emergency services, and other critical sectors with reliable, real-\u003cbr\u003etime communication capabilities, even in challenging or high-risk environments.\u003cbr\u003eThis topic aims to streamline the creation of an integrated ecosystem for secure\u003cbr\u003eand resilient communication systems that support civil security operations\u003cbr\u003eacross Europe. It aims to advance next-generation capabilities, ensuring robust,\u003cbr\u003escalable, and interoperable communication systems tailored to the critical civil\u003cbr\u003esecurity functions \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 05.11.2026","\u003cb\u003eInterreg Upper Rhine - Cross-Border Mobility\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding is available for transregional cooperation projects in the Upper Rhine\u003cbr\u003eregion of France, Switzerland and Germany. The focus of Interreg is on transfer\u003cbr\u003eof research results and knowledge sharing.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: The thematic call \u2018For a better connected region\u2019 (F\u00fcr eine besser vernetzte\u003cbr\u003eRegion) in the field of Cross-Border Mobility of the Interreg Upper Rhine\u003cbr\u003eprogramme covers the following two specific objectives (SO) of Priority B of the\u003cbr\u003eProgramme:\u00a0      SO B1: Development and improvement of sustainable, climate-\u003cbr\u003eresilient, smart and intermodal national, regional and local mobility, including\u003cbr\u003ebetter access to the TEN-T and cross-border mobility.     SO B2: Development of\u003cbr\u003ea climate-resilient, smart, safe, sustainable and intermodal TEN-T.\u003cbr\u003eApplications can be submitted at any time but no later than 10 December 2026.\u003cbr\u003eSelected projects must be completed by 30 June 2029.\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 10.12.2026","\u003cb\u003eFifth Joint Call for Research and Innovation Projects (DUT Call 2026)\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: The Driving Urban Transitions (DUT) European Partnership will aim to strengthen\u003cbr\u003ejoint efforts towards sustainable urban development.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: The fifth call to launch under the European Partnership\u00a0Driving Urban\u003cbr\u003eTransitions\u00a0(DUT)\u00a0aims to support three-year transnational research and\u002for\u003cbr\u003einnovation projects that help cities tackle urban challenges and transition\u003cbr\u003etowards a climate neutral and resilient future for all. Projects are expected to\u003cbr\u003efocus on urban areas (including peri-urban areas) in the context of achieving\u003cbr\u003eclimate neutral and resilient cities and their issues and challenges. Where\u003cbr\u003eappropriate, they may also consider the effects and impact on other territories\u003cbr\u003elike rural areas or consider urban-rural relationships.\u00a0The call welcomes a wide\u003cbr\u003erange of scientific disciplines such as strategic urban research, applied urban\u003cbr\u003eresearch and urban innovation. DUT Call 2026 is part of the\u00a0Mission Innovation\u003cbr\u003e(MI)\u00a0call series, ie, \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 17.11.2026","\u003cb\u003eTransition to Low-Temperature Heating Solutions in Multi-Apartment Buildings\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: This EU Mission aims to deliver 100 climate-neutral and smart cities by 2030\u003cbr\u003ewith a view to enabling all European cities to achieve climate neutrality by\u003cbr\u003e2050.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Low-temperature district heating systems in urban areas offer higher potential\u003cbr\u003efor integration of renewable energy sources and waste heat, but their deployment\u003cbr\u003eis slowed down because the existing stock of inefficient buildings has been\u003cbr\u003edesigned for high-temperature heat delivery systems. The topic supports the\u003cbr\u003ecreation of the conditions necessary for the conversion of existing supply\u003cbr\u003esolutions - district heating, as well as individual heating ones - into low-\u003cbr\u003etemperature alternatives, along with reducing and optimising the heat load of\u003cbr\u003ebuildings. Efficient district heating systems are expected to meet increasingly\u003cbr\u003estringent criteria in terms of the use of renewable energy, waste heat and\u002for\u003cbr\u003eco-generation in line with Article 26 of the Directive (EU) 2023\u002f1791. To help\u003cbr\u003edistrict heating \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 08.10.2026","\u003cb\u003eData Sharing to Support the Training and Development of AI Foundation Models in the Energy Sector\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding awarded under this cluster will support Europe's green transition based\u003cbr\u003eon competitive European industrial and service value chains, in particular in\u003cbr\u003ethe energy and mobility sector which represent markets that are predicted to\u003cbr\u003esubstantially grow globally.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: The quality of AI models depends strongly on the amount, quality, and\u003cbr\u003erepresentativeness of the data used for their training. Projects are expected to\u003cbr\u003efocus on developing, training and testing AI foundation models, using extensive\u003cbr\u003edata sets to accelerate the energy transition in key focus areas of the energy\u003cbr\u003esector. Projects are expected to:      Building on the results of previously\u003cbr\u003efunded projects on the Common European energy data space as well as the ongoing\u003cbr\u003ework within the Data 4 Energy expert group, projects are expected to demonstrate\u003cbr\u003einnovative methods and data governance strategies for sharing data among various\u003cbr\u003eenergy actors. Projects are expected to demonstrate that they have access to\u003cbr\u003elarge relevant datasets at the time of submitting the proposal.     Projects are\u003cbr\u003eexpected to \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 01.12.2026","\u003cb\u003ePrevention and Mitigation of Misuse of Synthetic Biology for Bioterrorism Purposes\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding to support European research and innovation to enhance cybersecurity and\u003cbr\u003econtribute to the resilience of digital infrastructures and their ability to\u003cbr\u003esupply and provide services, as well as the security and safety of all producers\u003cbr\u003eand users.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: The rising threat of bioterrorism is driven by recent scientific advancements,\u003cbr\u003enotably by growing accessibility of synthetic biology, genetic engineering,\u003cbr\u003erelated commercial services and public databases, which in turn enhance their\u003cbr\u003eobtainability to non-state actors and individuals with malicious intentions. The\u003cbr\u003eproliferation of do-it-yourself biohacking and community laboratories, including\u003cbr\u003egene editing and sequencing technology, dropping costs of equipment and\u003cbr\u003eincreased simplicity of use may inadvertently facilitate knowledge and skills\u003cbr\u003edissemination about biological threats and open new pathways for bioterrorism.\u003cbr\u003eChallenges in detection, particularly the lengthy incubation periods of\u003cbr\u003ebiological agents, underscore the urgent need for improved identification\u003cbr\u003etechnologies to allow for \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 05.11.2026","\u003cb\u003eIntegrated Surveillance Mechanism: Regional Cable Hubs\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding available for initiatives aimed to test the feasibility of an action and\u003cbr\u003eto prepare future EU activities.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: The Pilot Project will combine interaction with the range of concerned private\u003cbr\u003eactors related to cable security and analysis with small-scale pilots to explore\u003cbr\u003ethe full process of accessing and using such data:      Map the landscape of\u003cbr\u003esituational data held by private actors relevant to submarine-cable security,\u003cbr\u003esources and type of such data (cable-related telemetry, sensor feeds, satellite\u003cbr\u003eand maritime-surveillance data, underwater-drone outputs and other emerging\u003cbr\u003emodalities); identify their technical characteristics (eg real-time, proprietary\u003cbr\u003eformats, latency, frequency), ownership, confidentiality profile, availability,\u003cbr\u003eusage patterns and the legal, contractual, security or other applicable\u003cbr\u003econstraints governing their access.     Assess the feasibility of accessing and\u003cbr\u003eintegrating \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 08.10.2026","\u003cb\u003eGeopolitical Competition and Socioeconomic Resilience in CCAM: An Innovation and Policy Roadmap for EU Leadership (CCAM Partnership)\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding awarded under this cluster will support Europe's green transition based\u003cbr\u003eon competitive European industrial and service value chains, in particular in\u003cbr\u003ethe energy and mobility sector which represent markets that are predicted to\u003cbr\u003esubstantially grow globally.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: CCAM is a key area of global competition and one of the five pillars of the\u003cbr\u003eEuropean Automotive Action Plan for the automotive sector, aimed at helping the\u003cbr\u003eindustry regain its leadership in the shift towards smarter (AI-powered),\u003cbr\u003ecleaner and more connected vehicles, However, CCAM deployment is shaped by\u003cbr\u003eevolving geopolitical dynamics, rapid technological advancements and economic\u003cbr\u003euncertainties. Europe must secure its leadership in CCAM and strengthen its\u003cbr\u003esocioeconomic resilience by continuously addressing vulnerabilities and\u003cbr\u003eidentifying robust pathways for policy development and market deployment. This\u003cbr\u003etopic will assess the global geopolitical landscape of CCAM innovation, map\u003cbr\u003efuture pathways and develop evidence-based strategies for policymakers,\u003cbr\u003ebusinesses and investors. The results \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 08.10.2026","\u003cb\u003eEuropean Maritime Space and Inland Ports (AFIF) - Works\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding instrument to realise European transport infrastructure policy. It aims\u003cbr\u003eat supporting investments in building new transport infrastructure in Europe or\u003cbr\u003erehabilitating and upgrading existing infrastructure.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: The objective of this call is to modernise maritime transport infrastructure on\u003cbr\u003ethe TEN-T network and reducing the environmental impact of transport through\u003cbr\u003eefficient short sea shipping links and greening of inland shipping. Works\u003cbr\u003eprojects related to:      Projects supporting the deployment of Onshore-power\u003cbr\u003esupply and charging infrastructure in TEN-T maritime and inland ports in\u003cbr\u003eaccordance with Regulation 2023\u002f1804.     The fitting or retrofitting of the\u003cbr\u003eenergy systems of inland waterway vessels and short sea shipping vessels\u003cbr\u003e(including ferries), with electric, hybrid, H2, ammonia, methanol and biomethane\u003cbr\u003etechnologies, substitute sources of energy and the installation of wind assisted\u003cbr\u003epropulsion systems (WAPS).  For projects supporting the deployment of Onshore-\u003cbr\u003epower supply and charging \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 06.10.2026","\u003cb\u003eIntegrated Production and Product Development for Next-Generation Lithium-based Batteries for Mobility (BATT4EU and Made in Europe Partnerships)\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding awarded under this cluster will support Europe's green transition based\u003cbr\u003eon competitive European industrial and service value chains, in particular in\u003cbr\u003ethe energy and mobility sector which represent markets that are predicted to\u003cbr\u003esubstantially grow globally.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: This topic will support the scaling-up of next generation (ie beyond generation\u003cbr\u003e3) lithium-based batteries (eg semi and all-solid state, generation5) from cell\u003cbr\u003eprototypes (TRL 4-5) to demonstration of scalable production and demonstration\u003cbr\u003eof cell integration into module\u002fpack level. The projects will cover pilot\u003cbr\u003eproduction, process automation, system integration and demonstration, advanced\u003cbr\u003ecell design, and supply chain development to ensure that Europe remains at the\u003cbr\u003eforefront of battery innovation. The projects must address the needs of a single\u003cbr\u003especific and strategically relevant transport mode, and the targeted mode must\u003cbr\u003ebe clearly indicated in the proposal. The following transport modes are in\u003cbr\u003escope: Automotive; Aviation; Rail; Waterborne. The projects are expected to\u003cbr\u003ecover all of the \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 08.10.2026","\u003cb\u003eEuroHPC JU Call For Proposals for Benchmark And Development Access Mode 2026\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding to help develop, deploy, extend and maintain an integrated world class\u003cbr\u003esupercomputing and data infrastructure within the European Union and to develop\u003cbr\u003eand support a highly competitive and innovative High Performance Computing (HPC)\u003cbr\u003eecosystem.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: The purpose of the EuroHPC Joint Undertaking Benchmark and Development Access\u003cbr\u003ecalls is to support researchers and HPC application developers by giving them\u003cbr\u003ethe opportunity to develop, test and optimise their applications on the\u003cbr\u003eupcoming\u002favailable EuroHPC Pre-exascale and\u002for Petascale system prior to\u003cbr\u003eapplying for an Extreme Scale and\u002for Regular project. The goals of each of the\u003cbr\u003etwo access modes are:      Benchmark calls\u00a0are designed for code scalability\u003cbr\u003etests, the outcome of which is to be included in the proposal in a future\u003cbr\u003eEuroHPC Extreme Scale and Regular call.\u00a0Users receive a limited number of node\u003cbr\u003ehours; the maximum allocation period is three months.     Development calls\u00a0are\u003cbr\u003edesigned for projects focusing on code and algorithm development and\u003cbr\u003eoptimisation, as well as development of \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 01.12.2026","\u003cb\u003eAccessible and Available Travel Facilitation\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding to support European research and innovation to enhance cybersecurity and\u003cbr\u003econtribute to the resilience of digital infrastructures and their ability to\u003cbr\u003esupply and provide services, as well as the security and safety of all producers\u003cbr\u003eand users.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Facilitation of travel and border crossings at border crossing points (BCPs)\u003cbr\u003eacross the external EU borders went, and is further going, through developments\u003cbr\u003ethanks to updated procedures and regulatory frameworks and to innovative\u003cbr\u003eEuropean technologies. From automated border control (ABC) gates to 'no-gate'\u003cbr\u003esolutions and 'seamless travel', and wit tion addressing\u003cbr\u003ethese and other equally critical challenges. The proposal should also:\u003cbr\u003eDevelop a \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 17.11.2026","\u003cb\u003eNeutral-Atom Platform Technologies\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding to help develop, deploy, extend and maintain an integrated world class\u003cbr\u003esupercomputing and data infrastructure within the European Union and to develop\u003cbr\u003eand support a highly competitive and innovative High Performance Computing (HPC)\u003cbr\u003eecosystem.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: The proposal should advance the maturity and usability of neutral-atom quantum\u003cbr\u003eprocessors platforms with a focus on practical applications. It should include:\u003cbr\u003eDevelopment and deployment of scalable quantum processors with individually\u003cbr\u003eaddressable neutral atoms, supporting analogue simulation operation, hybrid\u003cbr\u003eanalogue-digital techniques and gate-based quantum computing.     Demonstration\u003cbr\u003eof real-world use cases (minimum two), addressing complex scientific or\u003cbr\u003eindustrial problems (eg, materials science, chemistry, optimisation) that are\u003cbr\u003eintractable for classical simulation\u002fcomputing. These should include\u003cbr\u003ebenchmarking and verification strategies to assess quantum advantage.\u003cbr\u003eDevelopment and integration of a complete software stack including quantum\u003cbr\u003econtrol systems, electronic control \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 17.11.2026","\u003cb\u003eCall A: Further Developing Excellence in Innovation within Regional Public-Private Partnerships and Achieving International Visibility\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType
