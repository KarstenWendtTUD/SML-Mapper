03eseeking to develop innovative low-carbon, renewable energy and energy efficiency\u003cbr\u003etechnologies.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Proposals are invited for Call 31 of the EUROGIA2030\u00a0Eureka Cluster Programme.\u003cbr\u003eEUROGIA2030 supports and promotes international partnerships conducting\u003cbr\u003ecollaborative projects to develop innovative products, processes or services for\u003cbr\u003ethe renewable energy and low carbon energy fields. The objective of its support\u003cbr\u003eis to address issues in the energy market and facilitate technologies to enable\u003cbr\u003eEurope to achieve carbon neutrality goals, manage a sustainable environment, and\u003cbr\u003emitigate climate change. Its Technology Roadmap is structured around the '5Ds'\u003cbr\u003estrategy: Decarbonisation, Decentralisation, Digitalisation, Democratisation and\u003cbr\u003eDeregulation. Challenges that EUROGIA2030 seeks to address are:      Carbon-free\u003cbr\u003eenergy supply.     Green mobility and smart cities.     Smarter housings and \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 29.10.2026","\u003cb\u003eYouth-Driven Social Media Design: Safe, Inclusive, and Publicly-Owned Social Media\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding available for initiatives aimed to test the feasibility of an action and\u003cbr\u003eto prepare future EU activities.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: This call seeks to fund a project that achieves the following general objective:\u003cbr\u003eThrough co-creation under youth participation, design and test a Fediverse\u003cbr\u003ebased\u002fAuthenticated Transfer (AT) Protocol-based social media platform that is\u003cbr\u003etargeted specifically at young EU citizens and is focused on user well-being,\u003cbr\u003eand adapt a roll-out strategy based on market research and stakeholder\u003cbr\u003econsultation. In order to achieve this objective, proposals should furthermore\u003cbr\u003eaddress the following specific objectives:      Involve young citizens from a\u003cbr\u003ewide variety of backgrounds and from at least eight Member States, including\u003cbr\u003eyoung persons with disabilities or neurodevelopmental conditions, in the\u003cbr\u003econceptualisation of key aspects of the platform, mapping their needs and\u003cbr\u003epreferences in platform design and \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 06.10.2026","\u003cb\u003eDigital Tech to Product - Development Projects\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: Bundesministerium f\u00fcr Digitales und Staatsmodernisierung (BMDS - Federal\u003cbr\u003eMinistry for Digital Transformation and Government Modernisation)\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Programme to promote the translation of novel digital technologies into specific\u003cbr\u003eproducts, services and business models. The focus is on projects by or involving\u003cbr\u003eSMEs in Germany.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: As part of the 'Digital Tech to Product' funding programme, BMDS has issued the\u003cbr\u003efirst call for proposals. Funding is provided for product-oriented innovation\u003cbr\u003eprojects in at least one or more aspects of the following priority areas: Focus\u003cbr\u003eArea 1: Artificial Intelligence and AI-based solutions      Technology-agnostic\u003cbr\u003edevelopment of AI applications, eg through the use or further development of\u003cbr\u003eopen foundation models or interoperability between different AI systems.\u003cbr\u003eCombining AI models from two or more application domains with the aim of cross-\u003cbr\u003edomain product development.     Generating economic or societal added value\u003cbr\u003ebased on AI models, published as open source and open models.     AI models and\u003cbr\u003eAI applications specialised in proprietary corporate data.     Specialised or\u003cbr\u003ecustomised AI \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 11.10.2026","\u003cb\u003eSuperconducting Platform Technologies\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding to help develop, deploy, extend and maintain an integrated world class\u003cbr\u003esupercomputing and data infrastructure within the European Union and to develop\u003cbr\u003eand support a highly competitive and innovative High Performance Computing (HPC)\u003cbr\u003eecosystem.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Proposals submitted in response to this call for proposals should contribute to\u003cbr\u003ethe scale-up and practical deployment of superconducting quantum computing\u003cbr\u003eplatforms and must address at least two of the critical technical roadblocks\u003cbr\u003eidentified in the SRIA 2030, among which necessarily:      Error Correction and\u003cbr\u003eFault Tolerance: the implementation of error correction and fault-tolerant\u003cbr\u003equantum computing via significant improvements in gate fidelity, coherence\u003cbr\u003etimes, and noise mitigation strategies.     Cryogenic and Interconnect\u003cbr\u003eEngineering: integration with cryoelectronic and efficient signal routing at low\u003cbr\u003etemperatures at the scale of 1,000+ qubits, also addressing the scalability\u003cbr\u003eissues that prevent the implementation of an industrial-grade quantum computing\u003cbr\u003eplatform.  In addition, the \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 17.11.2026","\u003cb\u003eRail - Studies, Works or Mixed - Cohesion Envelope\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding instrument to realise European transport infrastructure policy. It aims\u003cbr\u003eat supporting investments in building new transport infrastructure in Europe or\u003cbr\u003erehabilitating and upgrading existing infrastructure.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: The objective of this call is to develop rail transport infrastructure projects\u003cbr\u003eon the TEN-T core network. Scope: Works and\u002for studies related to:\u003cbr\u003eConstruction\u002fupgrading of cross-border and missing links.     Interconnections\u003cbr\u003ebetween rail and other modes of transport, namely inland waterway and maritime\u003cbr\u003etransport (including port hinterland connections) and projects aimed at the\u003cbr\u003eintegration of the high-speed rail and air networks to make the feeder network\u003cbr\u003efor long-haul flights more sustainable.  Priority will be given to projects\u003cbr\u003efostering the development of high-speed rail in line with the Commission\u003cbr\u003ecommunication on high-speed rail. Support will not be given to railway stations,\u003cbr\u003eexcept for railway infrastructure components. If the project includes such\u003cbr\u003ecomponents, they shall be \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 06.10.2026","\u003cb\u003eDigital Solutions for Regulatory Compliance Through Data\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding programme focused on bringing digital technology to EU businesses,\u003cbr\u003ecitizens and public administrations.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Specific Objective 2 of the Digital Europe Programme aims to reinforce the EU\u2019s\u003cbr\u003ecore Artificial Intelligence (AI) capacities as a crucial driver for the digital\u003cbr\u003etransformation of the public and private sectors. The vision is to make Europe\u003cbr\u003ean AI continent, thriving on the development, integration and adoption of AI. As\u003cbr\u003eone of the financial instruments of the upcoming Apply AI Strategy, SO2 will\u003cbr\u003esupport the development of world class AI models in the EU and foster the\u003cbr\u003eintegration of AI technologies into EU\u2019s most strategic sectors, including\u003cbr\u003ehealthcare, energy and research. It will stimulate new industrial uses of AI and\u003cbr\u003eimprove the delivery of various public services. In addition, it will support\u003cbr\u003ethe deployment of new digital solutions for regulatory compliance through data.\u003cbr\u003eThe objective \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 01.10.2026","\u003cb\u003eRail - Studies, Works or Mixed - General Envelope\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding instrument to realise European transport infrastructure policy. It aims\u003cbr\u003eat supporting investments in building new transport infrastructure in Europe or\u003cbr\u003erehabilitating and upgrading existing infrastructure.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: The objective of this call is to develop rail transport infrastructure projects\u003cbr\u003eon the TEN-T core network. Scope: Works and\u002for studies related to:\u003cbr\u003eConstruction\u002fupgrading of cross-border and missing links.     Interconnections\u003cbr\u003ebetween rail and other modes of transport, namely inland waterway and maritime\u003cbr\u003etransport (including port hinterland connections) and projects aimed at the\u003cbr\u003eintegration of the high-speed rail and air networks to make the feeder network\u003cbr\u003efor long-haul flights more sustainable.  Priority will be given to projects\u003cbr\u003efostering the development of high-speed rail in line with the Commission\u003cbr\u003ecommunication on high-speed rail. Support will not be given to railway stations,\u003cbr\u003eexcept for railway infrastructure components. If the project includes such\u003cbr\u003ecomponents, they shall be \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 06.10.2026","\u003cb\u003eResource Assessment for Deep Sedimentary and Basement Reservoirs\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding awarded under this cluster will support Europe's green transition based\u003cbr\u003eon competitive European industrial and service value chains, in particular in\u003cbr\u003ethe energy and mobility sector which represent markets that are predicted to\u003cbr\u003esubstantially grow globally.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Advanced methods, technologies and conceptual models, for different geological\u003cbr\u003esettings, to identify suitable conditions for geothermal resource exploitation,\u003cbr\u003etackling the issue of data scarcity and leveraging the information available.\u003cbr\u003eThe proposals are expected to contribute to the assessment of environmental and\u003cbr\u003esocial impacts and to unlock geothermal resources marked by low natural\u003cbr\u003epermeability at depths between 2000-6000m. The scope covers advances beyond the\u003cbr\u003estate of the art in equipment, methods and models capable of providing in-depth\u003cbr\u003eunderstanding and predictive power for properties and processes beyond\u003cbr\u003econventional depths. The proposals are expected to take into account the impact\u003cbr\u003eof reservoir conditions and parameters (ie in-situ stress, temperature, geo-\u003cbr\u003emechanical, chemical \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 01.12.2026","\u003cb\u003eImproved System Design for Innovative PV Applications (EUPI-PV Partnership)\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding awarded under this cluster will support Europe's green transition based\u003cbr\u003eon competitive European industrial and service value chains, in particular in\u003cbr\u003ethe energy and mobility sector which represent markets that are predicted to\u003cbr\u003esubstantially grow globally.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Proposals must address only one of the two areas (agriPV or offshore\u002fnearshore\u003cbr\u003ePV). They are expected to demonstrate:      A comprehensive (system) modelling\u003cbr\u003efor an accurate and reliable energy yield assessment with comparable\u003cbr\u003emethodologies for biodiversity, plant-yield and quality in the case of agriPV,\u003cbr\u003eas well as power generation.     Advanced system components and system\u003cbr\u003econcepts\u002farchitectures of adequate scale that minimise impact on\u003cbr\u003eland\u002fsea\u002fenvironment while maximizing energy output\u002foptimising connection to the\u003cbr\u003egrid.     Resilience and adaptation of the systems to climate change impacts\u003cbr\u003e(extreme events, or in the case of agriPV, changing agricultural practices\u003cbr\u003eand\u002for crops choices, etc).     Standardisation for module and structure design\u003cbr\u003efor these applications.     Permitting \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 01.12.2026","\u003cb\u003eWater4All 2026 Joint Transnational Call\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: European Co-funded Partnership proposing a portfolio of multi-national, multi-\u003cbr\u003efaceted and cross-sectoral approaches, encompassing policy, environmental,\u003cbr\u003eeconomic, technological and societal considerations to enable water security for\u003cbr\u003eall in the long term.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: The Fifth Joint Transnational Call will address the SRIA theme\u00a0Sustainable Water\u003cbr\u003eManagement\u00a0(excluding extreme events and circularity).\u00a0The funding opportunity\u003cbr\u003ewill support cutting-edge research and innovation projects that address critical\u003cbr\u003echallenges in Integrated Water Resource Management (IWRM), River Basin\u003cbr\u003eManagement, Groundwater Management, Water Resilience, Data Monitoring and Use\u003cbr\u003eand Water-Positive Solutions. Research and innovation proposals submitted under\u003cbr\u003ethe Water4All 2026 Joint Transnational Call are required to address at least one\u003cbr\u003eof the following topics:\u00a0      Topic 1: Integrated Monitoring and Assessment for\u003cbr\u003eSustainable Water Management.     Topic 2: Nature-Based Approaches for Resilient\u003cbr\u003eWater Management at hydrological and hydrogeological system scale.     Topic 3:\u003cbr\u003eSmart, \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 10.11.2026","\u003cb\u003eQuantum Experimental Pilot Lines for Quantum Technologies\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding to help develop, deploy, extend and maintain an integrated world class\u003cbr\u003esupercomputing and data infrastructure within the European Union and to develop\u003cbr\u003eand support a highly competitive and innovative High Performance Computing (HPC)\u003cbr\u003eecosystem.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: This action will strengthen Europe's leadership and strategic autonomy in\u003cbr\u003equantum technologies by advancing experimental pilot line capacities as a vital\u003cbr\u003estepping stone toward future industrial-scale quantum hardware production. Qu-\u003cbr\u003ePilot serves as the critical intermediary between academic research and the\u003cbr\u003estable pilot lines under the Chips Joint Undertaking, offering a testbed for\u003cbr\u003etechnological innovation, reproducibility, and manufacturability. The action is\u003cbr\u003eto implement the pilot production elements of the Qu-Pilot Framework Partnership\u003cbr\u003eAgreement. The proposal should advance the maturity of quantum hardware\u003cbr\u003etechnologies in alignment with EU industrial strategy, emphasising flexibility,\u003cbr\u003einnovation, and scalability. The proposal should address:      Establishment or\u003cbr\u003eenhancement of \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 17.11.2026","\u003cb\u003eDe-Risking Renewable Fuel Technologies Through Transnational Pre-Commercial Procurement of Renewable Fuel Industrial Value Chains\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding awarded under this cluster will support Europe's green transition based\u003cbr\u003eon competitive European industrial and service value chains, in particular in\u003cbr\u003ethe energy and mobility sector which represent markets that are predicted to\u003cbr\u003esubstantially grow globally.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: An exceptional effort is needed to develop, demonstrate and de-risk essential\u003cbr\u003erenewable fuels technologies and establish their industrial value chains in a\u003cbr\u003ecost-effective way to cover the EU needs where renewable fuels are the main\u003cbr\u003elong-term solution. Proposals should steer the development of these technologies\u003cbr\u003eat EU level and bring them to the market. Pre-commercial procurement of R&D,\u003cbr\u003evalidation and possibly, first deployment of industrial value chains of\u003cbr\u003eessential renewable fuel technologies is considered an effective tool to de-risk\u003cbr\u003esuch activities and overcome the \u201cvalley of death\u201d because real take off by\u003cbr\u003eengaging primarily concerned contracting entities is expected. The scope of this\u003cbr\u003eaction is to design and bring industrial value chains of essential renewable\u003cbr\u003efuel technologies at \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 01.12.2026","\u003cb\u003eAdvanced Digital Skills for AI Uptake in Health\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding programme focused on bringing digital technology to EU businesses,\u003cbr\u003ecitizens and public administrations.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: This topic aims to expand the offer of education and training in Artificial\u003cbr\u003eIntelligence in health jointly designed between higher education and training\u003cbr\u003einstitutions, research organisations and industry. The content must reflect the\u003cbr\u003elatest policy developments, notably the Apply AI Strategy\u00a0and the European\u003cbr\u003eHealth Data Space. It should cover developments in and application of AI and\u003cbr\u003erelated digital health technologies. The target audience is healthcare\u003cbr\u003eprofessionals, as well as computer and data scientists, programmers, and\u003cbr\u003esoftware developers working in the healthcare sector. Trainings must reflect the\u003cbr\u003elearning needs of the target audience and will vary in depth and technical\u003cbr\u003ecomplexity to accommodate different levels of expertise and learning\u003cbr\u003epreferences. To this end, the proposed \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 01.10.2026","\u003cb\u003eQuantum-Testing Infrastructure for Quantum Technologies\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding to help develop, deploy, extend and maintain an integrated world class\u003cbr\u003esupercomputing and data infrastructure within the European Union and to develop\u003cbr\u003eand support a highly competitive and innovative High Performance Computing (HPC)\u003cbr\u003eecosystem.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: The call aims at establishing a pan-European open-access testing infrastructure\u003cbr\u003efor quantum technologies, creating a comprehensive framework for validation and\u003cbr\u003ecertification of quantum components and systems. The proposal should implement\u003cbr\u003ethe testing-related part of the action plan established under the Framework\u003cbr\u003ePartnership Agreement for Qu-Test. The action must include:      Expansion and\u003cbr\u003einterconnection of open-access testing facilities in multiple Member States,\u003cbr\u003ecovering a range of quantum technologies (eg, processors, sensors, photonics,\u003cbr\u003econtrol systems).     Development and deployment of interoperable testing\u003cbr\u003emethodologies, benchmarking protocols, and certification procedures.\u003cbr\u003eIntegration of metrological and validation capabilities into existing RTOs and\u003cbr\u003eacademic \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 17.11.2026","\u003cb\u003eEnhancing the Security of Citizens Against Terrorism and Lone-Actor Violence in Confined Spaces Such as Schools\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding to support European research and innovation to enhance cybersecurity and\u003cbr\u003econtribute to the resilience of digital infrastructures and their ability to\u003cbr\u003esupply and provide services, as well as the security and safety of all producers\u003cbr\u003eand users.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Citizens in European schools and other confined spaces (eg, places of worship,\u003cbr\u003epublic administration and other buildings accessible to the public) increasingly\u003cbr\u003eface various forms of terrorism and lone-actor violence. This topic aims at\u003cbr\u003eproviding such places with solutions for ensuring civil security (of pupils,\u003cbr\u003eschool staff, administrative workers, citizens at large) via exploring various\u003cbr\u003esocietal and technological means of preventing such threats, with full respect\u003cbr\u003eof fundamental rights, such as rights to privacy and the protection of personal\u003cbr\u003edata. Based on a thorough analysis of the phenomenon under consideration in the\u003cbr\u003eEuropean context, proposals should look into methodologies of catching and\u003cbr\u003etackling early signs of terrorist threats, isolation and radicalisation, taking\u003cbr\u003einto account \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 05.11.2026","\u003cb\u003eEuroHPC JU Call for Proposals for Extreme Scale Access Mode\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding to help develop, deploy, extend and maintain an integrated world class\u003cbr\u003esupercomputing and data infrastructure within the European Union and to develop\u003cbr\u003eand support a highly competitive and innovative High Performance Computing (HPC)\u003cbr\u003eecosystem.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: The Extreme Scale Access mode is designed for applications with high-impact,\u003cbr\u003ehigh-gain innovative research, open to all fields of science, industry and\u003cbr\u003epublic sector justifying the need for and the capacity to use extremely large\u003cbr\u003eallocations in terms of compute time, data storage and support resources. This\u003cbr\u003eaccess mode distributes resources from the EuroHPC pre-exascale and exascale\u003cbr\u003esystems. The Regular Access Call offers three distinctive application tracks:\u003cbr\u003eScientific Access: Intended for applications from the academia and public\u003cbr\u003eresearch institutes.     Industry Access: Intended for applications with\u003cbr\u003ePrincipal Investigator (PIs) coming from industry.     Public Administration\u003cbr\u003eAccess: Intended for applications with PIs coming from the public sector.  The\u003cbr\u003eallocations are granted for \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 26.10.2026","\u003cb\u003eAdaptation of the TEN-T to Civilian-Defence Dual Use - Studies, Works or Mixed\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding instrument to realise European transport infrastructure policy. It aims\u003cbr\u003eat supporting investments in building new transport infrastructure in Europe or\u003cbr\u003erehabilitating and upgrading existing infrastructure.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: The objective of this call is to develop dual-use transport infrastructure on\u003cbr\u003ethe TEN-T and the military mobility networks. In accordance with Article 9(2),\u003cbr\u003epoint (c), and Article 12 of the CEF Regulation, support will be provided to\u003cbr\u003edual-use projects, works and\u002for studies, addressing both civilian and defence\u003cbr\u003eneeds. As provided in Article 12(1) of the CEF Regulation, dual-use projects\u003cbr\u003emust be located on the TEN-T and on the EU military mobility network established\u003cbr\u003eby the Council in November 2018, last updated in March 2025. Priority will be\u003cbr\u003egiven to projects located on the four EU military mobility priority corridors\u003cbr\u003eand projects located in two or more Member States. As provided in Article 12(1),\u003cbr\u003epoint (c) of the CEF Regulation, such projects are to take into account the\u003cbr\u003einfrastructure \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 06.10.2026","\u003cb\u003eReliability of Age Assessment Methods in the Context of Security and Border Management\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding to support European research and innovation to enhance cybersecurity and\u003cbr\u003econtribute to the resilience of digital infrastructures and their ability to\u003cbr\u003esupply and provide services, as well as the security and safety of all producers\u003cbr\u003eand users.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Many unaccompanied children and young persons arriving at the external EU\u003cbr\u003eborders and seeking asylum lack official documents showing their identity and\u003cbr\u003eage. Age assessment methods are important as they contribute to the\u003cbr\u003edetermination of, for example, where an individual will be initially housed and\u003cbr\u003ewhat services, supports, and legal processes they will receive to ensure\u003cbr\u003eprotection and, if applicable, child protection. In other cases, minors are\u003cbr\u003evictim of trafficking of human beings (THB) criminal activities, either across\u003cbr\u003ethe EU external borders, or within the EU borders. In other cases again, age\u003cbr\u003eassessment methods are necessary for law enforcement investigations on\u003cbr\u003eprotecting children, forensic investigation, and\u002for the identification of\u003cbr\u003evictims. No age assessment method can offer a \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 05.11.2026","\u003cb\u003eAlternative Fuel Infrastructure Facility: Road & Air Transport - Works\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding instrument to realise European transport infrastructure policy. It aims\u003cbr\u003eat supporting investments in building new transport infrastructure in Europe or\u003cbr\u003erehabilitating and upgrading existing infrastructure.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: The objective of this call is to support the deployment of alternative fuels\u003cbr\u003esupply infrastructure for road transport, and airport ground operations,\u003cbr\u003econtributing to decarbonising transport along the TEN-T network. Activities\u003cbr\u003eeligible for funding under this call relate to the deployment of alternative\u003cbr\u003efuels supply infrastructure. The infrastructure shall be deployed in accordance\u003cbr\u003ewith:      Regulation (EU) 2023\u002f1804 of the European Parliament and of the\u003cbr\u003eCouncil of 13 September 2023 on the deployment of alternative fuels\u003cbr\u003einfrastructure (hereafter 'the AFIR Regulation').     Regulation (EU) 2024\u002f1679\u003cbr\u003eof the European Parliament and of the Council of 13 June 2024 on Union\u003cbr\u003eguidelines for the development of the trans-European transport network, amending\u003cbr\u003eRegulation (EU) 2021\u002f1153 and (EU) \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 06.10.2026","\u003cb\u003eCo-Funded European Partnership for Social Transformations and Resilience\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding awarded under this cluster will address EU priorities that give a new\u003cbr\u003epush to European democracy; support an economy that works for people; the\u003cbr\u003eEuropean Green Deal; make Europe fit for the digital age; protect the European\u003cbr\u003eway of life; make Europe Stronger in the World; better manage migration and\u003cbr\u003emobility; protect Europe's cultural heritage and stimulate creativity.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Europe is undergoing critical social transformations driven by macro drivers of\u003cbr\u003echange, such as climate change, biodiversity loss, digitalisation and\u003cbr\u003edemographic change, which have been accelerated by events, such as the COVID-19\u003cbr\u003epandemic and Russia\u2019s war of aggression against Ukraine. These transformations\u003cbr\u003ebring challenges and opportunities such as changing skills demands and labour\u003cbr\u003eshortages, new digital and intergenerational divides, increasing inequalities\u003cbr\u003eand threats to social cohesion, and rising costs of social protection, among\u003cbr\u003eothers. The magnitude of these social transformations as well as the\u003cbr\u003eheterogeneity in welfare systems and labour markets call for combined inter- and\u003cbr\u003etransdisciplinary knowledge and resource sharing, and long-term concerted\u003cbr\u003eactions, on the basis of a \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 13.10.2026","\u003cb\u003eApply AI: Piloting AI-Based Image Screening in Medical Centres\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding programme focused on bringing digital technology to EU businesses,\u003cbr\u003ecitizens and public administrations.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Each project awarded in this action should implement a scalable cloud-based\u003cbr\u003eAI\u002fGenAI system running European trustworthy and safe AI\u002fGenAI algorithms that\u003cbr\u003ewere developed, trained and validated using very large sets of patient data.\u003cbr\u003eThey should put in place a secure, privacy-preserving cloud environment required\u003cbr\u003efor the health data analysis tasks, with appropriate access and identification\u003cbr\u003etools for authorised use only, and implement the whole system as described under\u003cbr\u003ethis topic, seamlessly integrated in regular clinical workflows of the care\u003cbr\u003esettings involved. Interoperability and the need to communicate with the health\u003cbr\u003eIT infrastructure (eg, the electronic health record (EHR) of the patient,\u003cbr\u003ePicture archiving and communication systems (PACS), Radiological Information\u003cbr\u003eSystems (RIS), \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 01.10.2026","\u003cb\u003eNext-Generation QKD Systems\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Call\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding to help develop, deploy, extend and maintain an integrated world class\u003cbr\u003esupercomputing and data infrastructure within the European Union and to develop\u003cbr\u003eand support a highly competitive and innovative High Performance Computing (HPC)\u003cbr\u003eecosystem.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: The action should support applied R&D in advanced QKD systems and their\u003cbr\u003eintegration into future secure communication networks, avoiding overlap with\u003cbr\u003eEuroQCI deployment efforts. Proposals must include:      Development and\u003cbr\u003eexperimental validation of advanced QKD protocols and systems such as:\u003cbr\u003eContinuons-variable QKD (CV-QKD).         Measurement-device-independent or\u003cbr\u003edevice-independent QKD.         Twin-field QKD (TF-QKD).          Design and\u003cbr\u003eimplementation of QKD integration into classical and optical networking\u003cbr\u003einfrastructure:              Compatibility with existing network equipment (eg,\u003cbr\u003erouters, switches).         Interface development for SDN\u002fNFV orchestration\u003cbr\u003eplatforms.         Secure key management compatible with enterprise-grade\u003cbr\u003eservices.          Demonstration of \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 17.11.2026"],"legendgroup":"Call","marker":{"color":"#383838","line":{"color":"white","width":2},"opacity":0.5,"size":120,"symbol":"diamond"},"mode":"markers+text","name":"Call","showlegend":true,"text":["Development of\u003cbr\u003eInnovative Tools,\u003cbr\u003eProcesses,\u003cbr\u003eEquipment and\u003cbr\u003eTechnologies\u003cbr\u003eThrough Responses\u003cbr\u003eto Disasters and\u003cbr\u003eEmergencies for\u003cbr\u003eSearch and Rescue\u003cbr\u003ein Hazardous\u003cbr\u003eConditions","Enhanced\u003cbr\u003eResilience in\u003cbr\u003eMultimodal\u003cbr\u003ePassenger\u003cbr\u003eTransport Through\u003cbr\u003eDigital\u003cbr\u003eTechnologies and\u003cbr\u003eGenerative and\u003cbr\u003eDiscriminative AI","Energy Efficient\u003cbr\u003eUrban and Sub-\u003cbr\u003eUrban Public\u003cbr\u003eTransport,\u003cbr\u003eComplemented by\u003cbr\u003eShared Mobility","Increasing\u003cbr\u003eCompetitiveness\u003cbr\u003eand Resilience of\u003cbr\u003eMultimodal Freight\u003cbr\u003eTransport and\u003cbr\u 003e\u003cb\u003eDescription\u003c\u002fb\u003e: Bundesagentur f\u00fcr Sprunginnovationen (SPRIND - German Federal Agency for\u003cbr\u003eDisruptive Innovation) acts as a forum between the German government, industry,\u003cbr\u003eand research representatives. The main objective of the federal corporation is\u003cbr\u003eto support breakthrough innovations. The Next Frontier Robotics Challenge aims\u003cbr\u003eto achieve fundamental breakthroughs in next-generation robotics hardware and\u003cbr\u003eintelligent, multi-purpose robotic systems in Europe. Through the challenge, the\u003cbr\u003einitiative supports teams developing modular, interoperable robotic technologies\u003cbr\u003ecapable of operating autonomously and robustly in complex, unstructured and\u003cbr\u003echanging real-world environments. The challenge has two focus tracks:      Track\u003cbr\u003e1: Integrated Platforms: Development of fully integrated, modular and multi-\u003cbr\u003epurpose robotic \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 22.10.2026\u003cbr\u003e\u003cb\u003eMax value (EUR)\u003c\u002fb\u003e: 7200000.0\u003cbr\u003e\u003cb\u003eMax value\u003c\u002fb\u003e: 7,200,000 EUR","\u003cb\u003eBMFTR - BiodivDetect: Technologies and Methods for Recording and Assessing Unexplored Aspects of Biodiversity in Germany\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Fund\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: Bundesministerium f\u00fcr Forschung, Technologie und Raumfahrt (BMFTR - Federal\u003cbr\u003eMinistry of Research, Technology and Space)\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding is available for collaborative research and development (R&D) projects\u003cbr\u003ewhose primary objective is the development, application and implementation of\u003cbr\u003etechnologies and methods for recording and assessing unexplored aspects of\u003cbr\u003ebiodiversity in Germany.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: The funding initiative 'BiodivDetect - Technologies and Methods for Recording\u003cbr\u003eand Assessing Unexplored Aspects of Biodiversity in Germany' (Technologien und\u003cbr\u003eMethoden zur Erfassung und Bewertung unerforschter Aspekte der Biodiversit\u00e4t in\u003cbr\u003eDeutschland) by Bundesministerium f\u00fcr Forschung, Technologie und Raumfahrt\u003cbr\u003e(BMFTR - Federal Ministry of Research, Technology and Space)\u00a0\u00a0contributes to the\u003cbr\u003eGerman government's Research for Sustainability (FONA) strategy and is part of\u003cbr\u003ethe BMFTR research initiative on the conservation of biodiversity (FEdA). As an\u003cbr\u003eexample of\u00a0the application and further development of modern key technologies\u003cbr\u003ewith relevance for society, it also contributes to the German\u003cbr\u003egovernment's\u00a0overarching High Tech Agenda Germany (HTAD).\u00a0 The aim of the\u003cbr\u003efunding initiative is to \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 26.11.2026\u003cbr\u003e\u003cb\u003eMax value (EUR)\u003c\u002fb\u003e: 1500000.0\u003cbr\u003e\u003cb\u003eMax value\u003c\u002fb\u003e: 1,500,000 EUR","\u003cb\u003eBMFTR - Sovereign Innovation Ecosystems for Cybersecurity and Communication Technologies\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Fund\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: Bundesministerium f\u00fcr Forschung, Technologie und Raumfahrt (BMFTR - Federal\u003cbr\u003eMinistry of Research, Technology and Space)\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding is provided for collaborative projects led by businesses and involving\u003cbr\u003eat least one university or research institution in Germany, to support the\u003cbr\u003etransfer and further development of cybersecurity and communication technology\u003cbr\u003einnovations.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: The funding initiative 'Sovereign Innovation Ecosystems for Cybersecurity and\u003cbr\u003eCommunication Technologies' (Souver\u00e4ne Innovations\u00f6kosysteme f\u00fcr Cybersicherheit\u003cbr\u003eund Kommunikationstechnologien)\u00a0by Bundesministerium f\u00fcr Forschung, Technologie\u003cbr\u003eund Raumfahrt (BMFTR - Federal Ministry of Research, Technology and Space) is\u003cbr\u003epart of the federal government's IT security framework research programme\u003cbr\u003eDigital. Sicher. Souver\u00e4n.\u00a0(Digital.\u00a0Secure.\u00a0Sovereign.) and the Digital.\u003cbr\u003eSicher. Vernetzt. (Digital. Secure. Connected.) research programme on\u003cbr\u003ecommunication systems, as well as the German government's overarching\u00a0High Tech\u003cbr\u003eAgenda Germany. This funding initiative supports collaborative research and\u003cbr\u003einnovation projects that accelerate the transfer of advanced cybersecurity and\u003cbr\u003ecommunication technology \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 15.10.2026\u003cbr\u003e\u003cb\u003eMax value\u003c\u002fb\u003e: Discretionary","\u003cb\u003eBMFTR - Safely into the Digital Future - a Cyber-Resilient Society through Secure, People-Centred IT Systems\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Fund\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: Bundesministerium f\u00fcr Forschung, Technologie und Raumfahrt (BMFTR - Federal\u003cbr\u003eMinistry of Research, Technology and Space)\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding is provided for research and development (R&D) projects that promote\u003cbr\u003esafer and more people-centred IT systems in Germany.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: The funding initiative 'Safely into the Digital Future - a Cyber-Resilient\u003cbr\u003eSociety through Secure, People-Centred IT Systems' (Sicher in die digitale\u003cbr\u003eZukunft - Cyberresiliente Gesellschaft durch sichere menschenzentrierte IT-\u003cbr\u003eSysteme)\u00a0by Bundesministerium f\u00fcr Forschung, Technologie und Raumfahrt (BMFTR -\u003cbr\u003eFederal Ministry of Research, Technology and Space) is part of the German\u003cbr\u003eGovernment's research framework programme on cyber security: 'Digital. Secure.\u003cbr\u003eSovereign'\u00a0as well as the German government's overarching High Tech Agenda\u003cbr\u003eGermany (HTAD).\u00a0 The aim of the funding initiative is to strengthen research,\u003cbr\u003eexpertise and practical application in the field of user-centred cybersecurity\u003cbr\u003ein Germany in the long term, and to advance solutions for human-centred and\u003cbr\u003euser-centred cybersecurity \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 15.10.2026\u003cbr\u003e\u003cb\u003eMax value\u003c\u002fb\u003e: Discretionary","\u003cb\u003eBMFTR - 6G Field Trials: A Bridge to Commercialisation from Infrastructure to End Devices\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Fund\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: Bundesministerium f\u00fcr Forschung, Technologie und Raumfahrt (BMFTR - Federal\u003cbr\u003eMinistry of Research, Technology and Space)\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding is provided to support industry-led consortia of companies, institutions\u003cbr\u003eof higher education and research institutes in Germany to further develop key 6G\u003cbr\u003etechnologies.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: The funding initiative '6G Field Trials: A Bridge to Commercialisation from\u003cbr\u003eInfrastructure to End Devices' (6G-Feldtests: Br\u00fccke zur Kommerzialisierung von\u003cbr\u003eder Infrastruktur bis zum Endger\u00e4t)\u00a0\u00a0by Bundesministerium f\u00fcr Forschung,\u003cbr\u003eTechnologie und Raumfahrt (BMFTR - Federal Ministry of Research, Technology and\u003cbr\u003eSpace) is part of the ministry's\u00a06G Research Roadmap and the Communications\u003cbr\u003eSystems Research Programme, as well as the German government's overarching High\u003cbr\u003eTech Agenda Germany. It is funded via the special fund for infrastructure and\u003cbr\u003eclimate neutrality. The initiative provides funding to support the further\u003cbr\u003edevelopment of highly relevant key 6G technologies (including end devices) to\u003cbr\u003ethe stage of functional prototypes, as well as to carry out large-scale field\u003cbr\u003etrials in relevant \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 15.10.2026\u003cbr\u003e\u003cb\u003eMax value\u003c\u002fb\u003e: Discretionary","\u003cb\u003eVolkswagenStiftung - zukunft.niedersachsen: Climate Future Labs\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Fund\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: VolkswagenStiftung (Volkswagen Foundation)\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding to support the formation of a research consortium to\u00a0develop\u003cbr\u003einterdisciplinary solutions for a secure and just climate future in Lower\u003cbr\u003eSaxony, Germany.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: The VolkswagenStiftung (Volkswagen Foundation) is an independent, non-corporate,\u003cbr\u003enon-profit foundation dedicated to the support of the humanities, social\u003cbr\u003esciences, and science and technology in higher education and research. With the\u003cbr\u003efunding initiative zukunft.niedersachsen, the Foundation solely promotes\u003cbr\u003eresearch projects at universities and research institutes in\u00a0Lower\u00a0Saxony,\u003cbr\u003eGermany, with the goal to strengthen the position of the federal state as a\u003cbr\u003escience location. The\u00a0Climate Future Labs\u00a0(Klima.Zukunftslabor) call for\u003cbr\u003eproposals supports the establishment and implementation of a research consortium\u003cbr\u003eon the topic of 'Climate Change, Justice, Society: Just Transition' as part of\u003cbr\u003ethe Climate Future Labs of the Lower Saxony Centre for Climate Research. The aim\u003cbr\u003eof the Climate Future Labs \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 03.11.2026\u003cbr\u003e\u003cb\u003eMax value\u003c\u002fb\u003e: Discretionary","\u003cb\u003eBMFTR\u002fMOTIR - German-Korean Research Collaboration: Semiconductors and AI-Based Assistive Robotics (2+2 Projects)\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Fund\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: Bundesministerium f\u00fcr Forschung, Technologie und Raumfahrt (BMFTR - Federal\u003cbr\u003eMinistry of Research, Technology and Space)\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding for bilateral German-Korean collaborative R&D projects that bring\u003cbr\u003etogether industry and research organisations to develop market-oriented\u003cbr\u003einnovations in semiconductors and AI-based assistive robotics.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: The 'Germany-Korea 2+2 Projects on Semiconductors and AI-Based Assistive\u003cbr\u003eRobotics' programme (Halbleiter und KI-basierte Assistenzrobotik) by the\u003cbr\u003eBundesministerium f\u00fcr Forschung, Technologie und Raumfahrt (BMFTR - Federal\u003cbr\u003eMinistry of Research, Technology and Space) and the Korean Ministry of Trade,\u003cbr\u003eIndustry and Energy of Korea (MOTIR) aims to strengthen scientific and\u003cbr\u003etechnological cooperation between Germany and the Republic of Korea by\u003cbr\u003esupporting bilateral R&D projects with strong involvement from both industry and\u003cbr\u003eacademia. It particularly seeks to promote technical innovations, significantly\u003cbr\u003eincrease technology readiness, facilitate future market introduction, expand the\u003cbr\u003epresence of German companies in Korea, and strengthen long-term German-Korean\u003cbr\u003eresearch and innovation partnerships. \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 04.11.2026\u003cbr\u003e\u003cb\u003eMax value (EUR)\u003c\u002fb\u003e: 1000000.0\u003cbr\u003e\u003cb\u003eMax value\u003c\u002fb\u003e: 1,000,000 EUR","\u003cb\u003eBMFTR - Artificial Intelligence in Value Chains\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Fund\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: Bundesministerium f\u00fcr Forschung, Technologie und Raumfahrt (BMFTR - Federal\u003cbr\u003eMinistry of Research, Technology and Space)\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding for collaborative flagship projects that develop, demonstrate and deploy\u003cbr\u003einnovative artificial intelligence solutions to strengthen value chains,\u003cbr\u003eaccelerate technology transfer, and enhance Germany's competitiveness across key\u003cbr\u003eindustrial sectors.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Within the Federal Government's Hightech Agenda Germany framework programme, the\u003cbr\u003e'Flagship Projects for Artificial Intelligence in Value Chains' programme\u003cbr\u003e(Leitprojekten f\u00fcr die Nutzung von KI in Wertsch\u00f6pfungsketten: Industrielle,\u003cbr\u003edom\u00e4nenspezifische KI zur Erschlie\u00dfung von Wertsch\u00f6pfungspotenzialenin deutschen\u003cbr\u003eSchl\u00fcsselbranchen) supports large-scale collaborative research and development\u003cbr\u003eprojects that develop and demonstrate domain-specific artificial intelligence\u003cbr\u003e(AI) systems tailored to the needs of German key industries. The programme aims\u003cbr\u003eto strengthen Germany's technological sovereignty and industrial competitiveness\u003cbr\u003eby advancing AI solutions that are deeply integrated into sector-specific value\u003cbr\u003echains and real-world industrial processes. Funded projects must develop\u003cbr\u003einnovative AI \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 01.11.2026\u003cbr\u003e\u003cb\u003eMax value\u003c\u002fb\u003e: Discretionary","\u003cb\u003eBMFTR - KMU-innovativ: Electronics and Autonomous Driving and High-Performance Computing\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Fund\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: Bundesministerium f\u00fcr Forschung, Technologie und Raumfahrt (BMFTR - Federal\u003cbr\u003eMinistry of Research, Technology and Space)\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding initiative for industry-led research and development (R&D) projects in\u003cbr\u003eelectronics, autonomous driving and high-performance computing, conducted by\u003cbr\u003esmall or medium sized enterprises (SME), research institutes and universities in\u003cbr\u003eGermany.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Within the Federal Government's\u00a0Mikroelektronik. Vertrauensw\u00fcrdig und\u003cbr\u003enachhaltig. F\u00fcr Deutschland und Europa\u00a0(Microelectronics. Trustworthy and\u003cbr\u003esustainable. For Germany and Europe) framework programme, this initiative (KMU-\u003cbr\u003einnovativ: Elektronik und autonomes Fahren; High Performance Computing) of the\u003cbr\u003eBundesministerium f\u00fcr Forschung, Technologie und Raumfahrt (BMFTR - Federal\u003cbr\u003eMinistry of Research, Technology and Space) offers research grants for industry-\u003cbr\u003eled research and development (R&D) projects in electronic systems, autonomous\u003cbr\u003edriving and high-performance computing. Both individual projects by SMEs or\u003cbr\u003eresearch consortia by SMEs and research institutes may receive funding under\u003cbr\u003ethis scheme. The main aims of this funding line are to strengthen SMEs and to\u003cbr\u003eaccelerate product development \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 15.10.2026\u003cbr\u003e\u003cb\u003eMax value\u003c\u002fb\u003e: Discretionary","\u003cb\u003eBMFTR - Junior Research Groups in Social-Ecological Research for Sustainable and Resilient Metropolitan Areas\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Fund\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: Bundesministerium f\u00fcr Forschung, Technologie und Raumfahrt (BMFTR - Federal\u003cbr\u003eMinistry of Research, Technology and Space)\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Five-year grants to support the career development of early career researchers\u003cbr\u003eand help them establish inter- and transdisciplinary research groups for the\u003cbr\u003esustainable development of metropolitan areas in Germany.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: The funding initiative 'Junior Research Groups in Social-Ecological Research for\u003cbr\u003eSustainable and Resilient Metropolitan Areas' (Sozial-\u00f6kologische\u003cbr\u003eNachwuchsgruppen f\u00fcr nachhaltige und resiliente Stadt-Umland-Regionen)\u003cbr\u003eby\u00a0Bundesministerium f\u00fcr Forschung, Technologie und Raumfahrt (BMFTR - Federal\u003cbr\u003eMinistry of Research, Technology and Space) is designed to support the career\u003cbr\u003edevelopment of early career researchers working in the area of socially oriented\u003cbr\u003esustainability research. Funding is provided for the establishment of research\u003cbr\u003egroups led by early career researchers in Germany that address the topic of\u003cbr\u003eurban development through a transdisciplinary research approach. The focus of\u003cbr\u003ethe programme is on the further qualification of the participating researchers.\u003cbr\u003eBMFTR therefore particularly \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 30.10.2026\u003cbr\u003e\u003cb\u003eMax value\u003c\u002fb\u003e: Discretionary","\u003cb\u003eBMFTR - Transfer and Network Integration of Quantum Communication\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Fund\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: Bundesministerium f\u00fcr Forschung, Technologie und Raumfahrt (BMFTR - Federal\u003cbr\u003eMinistry of Research, Technology and Space)\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding is available for research consortia which strengthen and expand the\u003cbr\u003etransfer of quantum communication technology into application in a targeted and\u003cbr\u003esustainable manner in Germany.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Within the Federal Government\u2019s research framework programme\u00a0Digital. Sicher.\u003cbr\u003eSouver\u00e4n.\u00a0(Digital. Secure. Independent.), this funding initiative (Transfer und\u003cbr\u003eNetzintegration der Quantenkommunikation) by the Bundesministerium f\u00fcr\u003cbr\u003eForschung, Technologie und Raumfahrt (BMFTR - Federal Ministry of Research,\u003cbr\u003eTechnology and Space) aims to accelerate the transfer of quantum communication\u003cbr\u003etechnology into application and advance its integration into existing and future\u003cbr\u003eICT networks and digital infrastructure in Germany. Funding is provided for\u003cbr\u003eapplication-oriented research projects as well as an overarching umbrella\u003cbr\u003eproject in the field of quantum communication. Application- and end-user-\u003cbr\u003eoriented research projects should focus on areas which advance both the\u003cbr\u003eintegration of quantum communication \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 30.11.2026\u003cbr\u003e\u003cb\u003eMax value\u003c\u002fb\u003e: Discretionary","\u003cb\u003eBMWE - Climate-Neutral Heat Sources (KEWinnA)\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Fund\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: Bundesministerium f\u00fcr Wirtschaft und Energie (BMWE - Federal Ministry for\u003cbr\u003eEconomic Affairs and Energy)\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding for the holistic planning and design of micro-projects for developing\u003cbr\u003eremote, climate-neutral heat sources in Germany.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: The 'Cost-Efficient Development of Remote Climate-Neutral Heat Sources through\u003cbr\u003eInnovative Connection (KEWinnA)'\u00a0innovation competition (Kosteneffiziente\u003cbr\u003eErschlie\u00dfung von entfernten klimaneutralen W\u00e4rmequellen durch innovative\u003cbr\u003eAnbindung) is part of the 8th Energy Research Programme for Applied Energy\u003cbr\u003eResearch\u00a0(8. Energieforschungsprogramm zur angewandten Energieforschung) of\u003cbr\u003eBundesministerium f\u00fcr Wirtschaft und Energie (BMWE - Federal Ministry for\u003cbr\u003eEconomic Affairs and Energy). It addresses in particular the objectives of the\u003cbr\u003eHeat Mission (W\u00e4rmewende Mission) of the 8th Energy Research Programme. The\u003cbr\u003einnovation competition aims to promote research, development and demonstration\u003cbr\u003efor the exploitation of remote heat sources through research competitions. The\u003cbr\u003efirst step is to identify \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 31.10.2026\u003cbr\u003e\u003cb\u003eMax value\u003c\u002fb\u003e: Discretionary","\u003cb\u003eBMFTR - Innovative Production of E-Fuels and CCU-Based Feedstocks: New Approaches for the Climate-Neutral Fuels of the Future\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Fund\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: Bundesministerium f\u00fcr Forschung, Technologie und Raumfahrt (BMFTR - Federal\u003cbr\u003eMinistry of Research, Technology and Space)\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding is provided for high-risk research, development and innovation (R&D&I)\u003cbr\u003eprojects in Germany aimed at the production, further development and use of\u003cbr\u003ee-fuels, as well as associated key technologies.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Bundesministerium f\u00fcr Forschung, Technologie und Raumfahrt (BMFTR - Federal\u003cbr\u003eMinistry of Research, Technology and Space) has launched the funding initiative\u003cbr\u003e'Innovative Production of E-Fuels and CCU-Based Feedstocks - New Approaches for\u003cbr\u003ethe Climate-Neutral Fuels of the Future' (Innovative Herstellung von E-Fuels und\u003cbr\u003eCCU-basierten Vorprodukten - Neue Wege f\u00fcr klimaneutrale Kraftstoffe der\u003cbr\u003eZukunft) with the aim of further strengthening Germany's position as a leading\u003cbr\u003ecentre of research and development in Europe for technologies to produce\u003cbr\u003eclimate-friendly, electricity- and hydrogen-based e-fuels. In the long term, it\u003cbr\u003eis also intended to position the country as a leading global supplier and a\u003cbr\u003emajor exporter of technology. The programme contributes to the German\u003cbr\u003egovernment's High-Tech Agenda \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 30.11.2026\u003cbr\u003e\u003cb\u003eMax value\u003c\u002fb\u003e: Discretionary","\u003cb\u003eSYSTEMEU: Funding for Digital Transformation in Healthcare\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Fund\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: SYSTEMEU\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding for interregional projects developing, testing and validating digital\u003cbr\u003esolutions in healthcare, energy and mobility.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: SYSTEMEU\u00a0is a Horizon Europe project bringing together 15 organisations across 5\u003cbr\u003eEuropean regions with the aim to bridge innovation gaps through interregional\u003cbr\u003ecollaboration and deep-tech deployment in Healthcare, Energy and Mobility.\u003cbr\u003eSYSTEMEU provides Financial Support to Third Parties (FSTP) to support\u003cbr\u003einterregional projects that develop, test, and validate innovative digital\u003cbr\u003esolutions in real-world environments, moving technology from proven prototype to\u003cbr\u003eoperational demonstrator across the following three sectors:      Healthcare -\u003cbr\u003eDigital transformation delivering societal and economic impact. Topics: AI\u003cbr\u003ediagnostics, remote patient monitoring, clinical decision support, digital\u003cbr\u003ehealth data platforms, improved care access.     Energy - Innovative deep-tech\u003cbr\u003edeployment to optimise energy \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 16.11.2026\u003cbr\u003e\u003cb\u003eMax value (EUR)\u003c\u002fb\u003e: 2576474.0\u003cbr\u003e\u003cb\u003eMax value\u003c\u002fb\u003e: 2,200,000 GBP","\u003cb\u003eBMFTR - KMU-innovativ: Energy Efficiency, Climate Protection and Climate Adaptation\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Fund\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: Bundesministerium f\u00fcr Forschung, Technologie und Raumfahrt (BMFTR - Federal\u003cbr\u003eMinistry of Research, Technology and Space)\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Project funding for industry-led research consortia whose research concerns one\u003cbr\u003eof the following topics: energy efficiency, climate protection or climate\u003cbr\u003eadaptation in Germany.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: In the context of its funding initiative KMU Innovativ('SME Innovative'), this\u003cbr\u003einitiative (KMU-innovativ: Energieeffizienz, Klimaschutz und Klimaanpassung) of\u003cbr\u003eBundesministerium f\u00fcr Forschung, Technologie und Raumfahrt (BMFTR - Federal\u003cbr\u003eMinistry of Research, Technology and Space) offers research grants for industry-\u003cbr\u003eled research and development (R&D) projects on energy efficiency, climate\u003cbr\u003eprotection and climate adaptation. Both individual projects by small and medium-\u003cbr\u003esized enterprises (SMEs) or research consortia which include SMEs and\u003cbr\u003einstitutions of higher education (Hochschulen), non-educational research\u003cbr\u003einstitutions, local authorities or\u00a0other commercial businesses may receive\u003cbr\u003efunding under this scheme. The main aims for this funding line are to strengthen\u003cbr\u003ethe performance of SMEs and \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 15.10.2026\u003cbr\u003e\u003cb\u003eMax value\u003c\u002fb\u003e: Discretionary","\u003cb\u003eIntegrated Research Infrastructure Services for Climate Change Risks (IRISCC) Open Access Calls\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Fund\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Opportunities to access European Research Infrastructures\u00a0through a series\u003cbr\u003eof\u00a0transnational or virtual access\u00a0calls\u00a0addressing key topics such as ecosystem\u003cbr\u003eresilience, climate-driven health risks, water management, and food systems.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Integrated Research Infrastructure Services for Climate Change Risks (IRISCC) is\u003cbr\u003ean Horizon Europe-funded project designed to empower society to understand,\u003cbr\u003epredict and build resilience to climate change risks by providing access to\u003cbr\u003einnovative research infrastructure (RI) services. The project has a total budget\u003cbr\u003eof \u20ac14,499,857.75 over a 54-month period from April 2024 to September 2028.\u003cbr\u003eIRISCC brings together a diverse network of RIs, including observatories,\u003cbr\u003eexperimental facilities, modelling capabilities, and advanced data\u003cbr\u003einfrastructures, spanning environmental and social sciences across various\u003cbr\u003edomains. This collaboration provides a range of services for researchers,\u003cbr\u003epolicymakers, and stakeholders engaged in climate change risk management. As\u003cbr\u003epart of its activities, IRISCC\u00a0provides \u2026\u003cbr\u003e\u003cb\u003eDeadline\u
