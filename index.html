ionary","\u003cb\u003eBMFTR -  The Mesopelagic: A Key Region in Transition (MARE:N)\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Fund\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: Bundesministerium f\u00fcr Forschung, Technologie und Raumfahrt (BMFTR - Federal\u003cbr\u003eMinistry of Research, Technology and Space)\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding for research consortia that investigate the role of the mesopelagic zone\u003cbr\u003ein the global climate system, marine carbon cycling and ocean observation in\u003cbr\u003eGermany.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Within the Federal Government's 'Coastal, Marine and Polar Research for\u003cbr\u003eSustainability' Framework Programme (MARE:N - K\u00fcsten-, Meeres- und\u003cbr\u003ePolarforschung f\u00fcr Nachhaltigkeit),\u00a0Strategy for Research on Sustainability\u003cbr\u003e(FONA) and Hightech Agenda, this initiative (F\u00f6rderung von Projekten zum Thema\u003cbr\u003e'Das Mesopelagial - eine Schl\u00fcsselregion im Wandel') by the Bundesministerium\u003cbr\u003ef\u00fcr Forschung, Technologie und Raumfahrt (BMFTR - Federal Ministry of Research,\u003cbr\u003eTechnology and Space) aims to expand scientific knowledge of the mesopelagic\u003cbr\u003ezone, reduce uncertainties in climate projections, strengthen ocean observation\u003cbr\u003eand modelling, and support evidence-based climate adaptation and sustainable\u003cbr\u003emarine resource management. The call seeks to improve understanding of the\u003cbr\u003emesopelagic zone (200-1,000 metres \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 01.10.2026\u003cbr\u003e\u003cb\u003eMax value (EUR)\u003c\u002fb\u003e: 2500000.0\u003cbr\u003e\u003cb\u003eMax value\u003c\u002fb\u003e: 2,500,000 EUR","\u003cb\u003eBMFTR - KMU-innovativ: Medical Technology\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Fund\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: Bundesministerium f\u00fcr Forschung, Technologie und Raumfahrt (BMFTR - Federal\u003cbr\u003eMinistry of Research, Technology and Space)\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding initiative for industry-led research and development (R&D) projects in\u003cbr\u003e(digital) medical technology, conducted by small or medium sized enterprises\u003cbr\u003e(SMEs), research institutes, clinics and universities in Germany.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: In the context of its funding initiative KMU Innovativ (SME Innovative), the\u003cbr\u003eBundesministerium f\u00fcr Forschung, Technologie und Raumfahrt (BMFTR - Federal\u003cbr\u003eMinistry of Research, Technology and Space) offers research grants (KMU-\u003cbr\u003einnovativ: Medizintechnik) for industry-led research and development (R&D)\u003cbr\u003eprojects in medical and digital health technology. Both individual projects by\u003cbr\u003eSMEs or research consortia by SMEs and research institutes may receive funding\u003cbr\u003eunder this scheme. The aim is to research innovative (digital) medical\u003cbr\u003etechnology solutions which address a medical care need and bring about\u003cbr\u003esignificant improvements in patient care. Medical technology solutions are\u003cbr\u003edefined as care solutions that include a medical device (including digital\u003cbr\u003emedical devices and medical device software) or \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 15.10.2026\u003cbr\u003e\u003cb\u003eMax value\u003c\u002fb\u003e: Discretionary","\u003cb\u003eNovo Nordisk Foundation Challenge Programme 2027: Unravelling Electron Transfer Mechanisms in Hybrid Bio-Electrocatalysis\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Fund\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: Novo Nordisk Fonden (NNF - Novo Nordisk Foundation)\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding over a maximum of six years for fundamental and applied electro-\u003cbr\u003ebiotechnology research to fundamentally understand electron transfer between\u003cbr\u003esynthetic and biological systems to enhance efficient bio-electrocatalysis to\u003cbr\u003eaddress urgent challenges in clean energy generation, resource-efficient\u003cbr\u003emanufacturing, and sustainable fuel and chemical production.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: The Novo Nordisk Foundation (NNF - Novo Nordisk Fonden) is an independent Danish\u003cbr\u003efoundation that oversees the commercial and research activities of the companies\u003cbr\u003ewithin the Novo Group. NNF contributes around DKK 5 billion each year for\u003cbr\u003escientific research and humanitarian and social purposes. Its grant programme\u003cbr\u003efocuses mainly on Denmark and the Nordic countries, but also includes funding\u003cbr\u003efor international collaboration, strategic international initiatives and awards\u003cbr\u003efor outstanding researchers. NNF has established the Challenge Programme to\u003cbr\u003eprovide support for Danish and European researchers conducting collaborative\u003cbr\u003eprojects within areas of strategic priority that align with the Foundation's\u003cbr\u003eResearch Strategy. The goal is to develop innovative solutions to major\u003cbr\u003escientific challenges, \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 07.10.2026\u003cbr\u003e\u003cb\u003eMax value (EUR)\u003c\u002fb\u003e: 10032640.0\u003cbr\u003e\u003cb\u003eMax value\u003c\u002fb\u003e: 75,000,000 DKK","\u003cb\u003eSPRIND Challenge: AI-Native Chip Design\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Fund\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: Bundesagentur f\u00fcr Sprunginnovationen (SPRIND - German Federal Agency for\u003cbr\u003eBreakthrough Innovation)\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding for projects dedicated to the rapid design of high-efficiency AI chips\u003cbr\u003ewith the help of AI-native systems\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Bundesagentur f\u00fcr Sprunginnovationen (SPRIND - German Federal Agency for\u003cbr\u003eBreakthrough Innovation) acts as a forum between the German government,\u003cbr\u003eindustry, and research representatives. SPRIND finances international research\u003cbr\u003eand development projects for ground-breaking technologies and topics that have\u003cbr\u003ethe potential to fundamentally improve people's lives. The aim of the AI-Native\u003cbr\u003eChip Design Challenge is\u00a0to leverage AI to drastically shorten the design\u003cbr\u003eprocess of high-performance chips and develop concrete, production-ready chip\u003cbr\u003edesigns tailored for AI applications.\u00a0Projects should develop AI methods that\u003cbr\u003eenable the design of new chips within weeks. This development should directly\u003cbr\u003elead to concrete, tape-out ready designs for high-performance chips. The\u003cbr\u003eoverarching objective is to \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 30.11.2026\u003cbr\u003e\u003cb\u003eMax value (EUR)\u003c\u002fb\u003e: 9600000.0\u003cbr\u003e\u003cb\u003eMax value\u003c\u002fb\u003e: 9,600,000 EUR","\u003cb\u003eBMFTR - Secure Processing Environments in Health Research\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Fund\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: Bundesministerium f\u00fcr Forschung, Technologie und Raumfahrt (BMFTR - Federal\u003cbr\u003eMinistry of Research, Technology and Space)\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding to develop and test secure processing environments for the safe and\u003cbr\u003elegally compliant use of sensitive health data in Germany.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Within the Federal Government's Hightech Agenda Germany (HTAD) and Health\u003cbr\u003eResearch Programme (Gesundheitsforschung),\u00a0the initiative 'Secure Processing\u003cbr\u003eEnvironments in Health Research' (F\u00f6rderung von Pilotprojekten zur Entwicklung\u003cbr\u003eund Erprobung von Komponenten und Anforderungen f\u00fcr sichere\u003cbr\u003eVerarbeitungsumgebungen (Secure Processing Environments) in der\u003cbr\u003eGesundheitsforschung) by the Bundesministerium f\u00fcr Forschung, Technologie und\u003cbr\u003eRaumfahrt (BMFTR - Federal Ministry of Research, Technology and Space) aims to\u003cbr\u003eimprove the use of sensitive research and health data held within existing\u003cbr\u003eGerman health research data infrastructures (GFDI -\u003cbr\u003eGesundheitsforschungsdateninfrastrukturen) through secure processing\u003cbr\u003eenvironments. The programme also supports Germany's future integration into the\u003cbr\u003eEuropean \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 28.10.2026\u003cbr\u003e\u003cb\u003eMax value\u003c\u002fb\u003e: Discretionary","\u003cb\u003eEUREKA: EUROGIA2030\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Fund\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: EUREKA\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: EUROGIA2030 is the EUREKA Cluster for low carbon technologies. It promotes and\u003cbr\u003esupports pan-European partnerships of commercial and research organisations\u003cbr\u003eseeking to develop innovative low-carbon, renewable energy and energy efficiency\u003cbr\u003etechnologies.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: EUROGIA2030 is the EUREKA Cluster for low carbon technologies. It supports and\u003cbr\u003epromotes international partnerships conducting projects to develop innovative\u003cbr\u003eproducts, processes or services for the renewable energy and low carbon energy\u003cbr\u003efields, with the objective of addressing issues in the energy market and\u003cbr\u003efacilitating technologies to enable Europe to achieve carbon neutrality goals,\u003cbr\u003emanage a sustainable environment, and mitigate climate change. Its Technology\u003cbr\u003eRoadmap is structured around the '5Ds' strategy: Decarbonisation,\u003cbr\u003eDecentralisation, Digitalisation, Democratisation and Deregulation. Challenges\u003cbr\u003ethat EUROGIA2030 seeks to address are:      Carbon-free energy supply     Green\u003cbr\u003emobility and smart cities     Smarter housing and constructions     Bio\u003cbr\u003eresources and environment  EUROGIA \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 29.10.2026\u003cbr\u003e\u003cb\u003eMax value\u003c\u002fb\u003e: Discretionary","\u003cb\u003eBMFTR - KMU-innovativ: Information and Communication Technologies (IKT)\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Fund\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: Bundesministerium f\u00fcr Forschung, Technologie und Raumfahrt (BMFTR - Federal\u003cbr\u003eMinistry of Research, Technology and Space)\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding initiative for industry-led research and development (R&D) projects on\u003cbr\u003einformation and communication technologies, conducted by small or medium sized\u003cbr\u003eenterprises (SMEs), research institutes and universities in Germany.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: In the context of the Federal Government\u2019s Future Strategy for Research and\u003cbr\u003eInnovation (Zukunftsstrategie Forschung und Innovation)\u00a0and the funding\u003cbr\u003eprogramme KMU Innovativ\u00a0(SME Innovative), this initiative (KMU-innovativ:\u003cbr\u003eInformations- und Kommunikationstechnologie -IKT) of Bundesministerium f\u00fcr\u003cbr\u003eForschung, Technologie und Raumfahrt (BMFTR - Federal Ministry of Research,\u003cbr\u003eTechnology and Space) offers research grants for industry-led research and\u003cbr\u003edevelopment (R&D) projects in information and communication (ICT) technologies.\u003cbr\u003eBoth individual projects by small or medium sized enterprises (SMEs) or research\u003cbr\u003econsortia which include SMEs and research institutes may receive funding under\u003cbr\u003ethis scheme. The main aims for this funding line are to strengthen SMEs and to\u003cbr\u003eaccelerate product development \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 15.10.2026\u003cbr\u003e\u003cb\u003eMax value\u003c\u002fb\u003e: Discretionary","\u003cb\u003eHelmholtz AI Projects\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Fund\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: Helmholtz-Gemeinschaft Deutscher Forschungszentren (Helmholtz Association of\u003cbr\u003eGerman Research Centres)\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding for research projects at Helmholtz Centres in Germany which focus on\u003cbr\u003eMachine Learning (ML) and Artificial Intelligence (AI).\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: The Helmholtz Association is a union of 18 scientific-technical and biological-\u003cbr\u003emedical research centres. It is the biggest scientific organisation in Germany\u003cbr\u003ewhich develops research programmes for six research fields: energy, earth and\u003cbr\u003eenvironment, health, aeronautics, space and transport, key technologies and\u003cbr\u003estructure of matter. The Helmholtz AI Cooperation Unit (HAICU) is an\u003cbr\u003einterdisciplinary platform, which compiles, develops, fosters, and promotes\u003cbr\u003eArtificial Intelligence-based approaches for all Helmholtz Research Centres. The\u003cbr\u003eobjective of the\u00a0Helmholtz AI Projects call\u00a0is to initiate and facilitate\u003cbr\u003eactivities that address cross-centre challenges and methods. It is intended to\u003cbr\u003esupport several smaller collaborative projects with the potential to facilitate\u003cbr\u003elarger follow-up projects. \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 12.11.2026\u003cbr\u003e\u003cb\u003eMax value (EUR)\u003c\u002fb\u003e: 250000.0\u003cbr\u003e\u003cb\u003eMax value\u003c\u002fb\u003e: 250,000 EUR","\u003cb\u003eHorizon Europe: Mission - Climate Neutral and Smart Cities\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Fund\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: This EU Mission aims to deliver 100 climate-neutral and smart cities by 2030\u003cbr\u003ewith a view to enabling all European cities to achieve climate neutrality by\u003cbr\u003e2050.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Missions are a novel instrument in Horizon Europe for the 2021-2027 programming\u003cbr\u003eperiod. They aim to tackle some of the world's greatest challenges with\u003cbr\u003esystemic, concrete solutions, leading to societal transformations and social\u003cbr\u003eimpact. Missions will also help deliver key EU policy priorities such as\u003cbr\u003ethe\u00a0European Green Deal, the\u00a0Climate Adaptation Strategy, Europe's\u00a0Beating\u003cbr\u003eCancer Plan\u00a0and\u00a0A Europe fit for the Digital Age, among others. The missions\u003cbr\u003ehave ambitious goals and will deliver concrete results by 2030. Each mission\u003cbr\u003ewill operate as a portfolio of actions - such as research projects, policy\u003cbr\u003emeasures or even legislative initiatives - to achieve a measurable goal that\u003cbr\u003ecould not be achieved through individual actions. To achieve their goals and\u003cbr\u003epromote societal change, missions will \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 08.10.2026\u003cbr\u003e\u003cb\u003eMax value\u003c\u002fb\u003e: Discretionary","\u003cb\u003eBMWE - Developing and Scaling Up Bio-Based Processes and Building Regional Innovation Clusters (Industrial Bioeconomy)\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Fund\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: Bundesministerium f\u00fcr Wirtschaft und Energie (BMWE - Federal Ministry for\u003cbr\u003eEconomic Affairs and Energy)\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding is available for individual as well as joint projects which contribute\u003cbr\u003eto a sustainable bioeconomy by further developing, scaling up and testing bio-\u003cbr\u003ebased products and processes in Germany.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Within the Federal Government\u2019s Nationale Bio\u00f6konomiestrategie (National\u003cbr\u003eBioeconomy Strategy) and Industriestrategie (Industrial Strategy), this\u003cbr\u003einitiative (Etablierung einer industriellen Bio\u00f6konomiedurch die\u003cbr\u003eWeiterentwicklung und Skalierung biobasierter Verfahrensowie den Aufbau\u003cbr\u003eregionaler Innovationscluster) by Bundesministerium f\u00fcr Wirtschaft und Energie\u003cbr\u003e(BMWE - Federal Ministry for Economic Affairs and Energy) promotes the further\u003cbr\u003edevelopment, scaling and practical testing of innovative and sustainable\u003cbr\u003eproducts and processes which are based on the use of biogenic raw and residual\u003cbr\u003ematerials or the utilisation of CO2 through biotechnological processes and\u003cbr\u003emethods. Funding is provided for individual as well as joint projects which make\u003cbr\u003ea relevant contribution to a sustainable bioeconomy \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 15.10.2026\u003cbr\u003e\u003cb\u003eMax value\u003c\u002fb\u003e: Discretionary","\u003cb\u003eBMUKN - Research Funding for Nuclear Safety\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Fund\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: Bundesministerium f\u00fcr Umwelt, Klimaschutz, Naturschutz und nukleare Sicherheit\u003cbr\u003e(BMUKN - Federal Ministry for the Environment, Climate Protection, Nature\u003cbr\u003eConservation and Nuclear Safety)\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding for research and development projects in Germany with a focus on reactor\u003cbr\u003esafety, interim storage and treatment of nuclear waste as well as its final\u003cbr\u003edisposal.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Following on from the Research Programme for Nuclear Safety (2021-25) by\u003cbr\u003eBundesministerium f\u00fcr Wirtschaft und Energie (BMWE - Federal Ministry for\u003cbr\u003eEconomic Affairs and Energy), the Bundesministerium f\u00fcr Umwelt, Klimaschutz,\u003cbr\u003eNaturschutz und nukleare Sicherheit (BMUKN - Federal Ministry for the\u003cbr\u003eEnvironment, Climate Protection, Nature Conservation and Nuclear Safety) has\u003cbr\u003ecreated the programme for 'Research Funding on Nuclear Safety'\u003cbr\u003e(Forschungsf\u00f6rderung zur nuklearen Sicherheit). The programme is intended to\u003cbr\u003epromote the development of scientific insights that can contribute to the\u003cbr\u003eevaluation and improvement of the safety of nuclear plants and the safe disposal\u003cbr\u003eof radioactive waste in Germany.\u00a0 Funding is provided for application-oriented\u003cbr\u003ebasic research in the areas of reactor safety and \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 31.10.2026\u003cbr\u003e\u003cb\u003eMax value (EUR)\u003c\u002fb\u003e: 55000000.0\u003cbr\u003e\u003cb\u003eMax value\u003c\u002fb\u003e: 55,000,000 EUR","\u003cb\u003eBMFTR - KMU-innovativ: Bioeconomy\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Fund\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: Bundesministerium f\u00fcr Forschung, Technologie und Raumfahrt (BMFTR - Federal\u003cbr\u003eMinistry of Research, Technology and Space)\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding initiative designed to support SMEs and SME\u002funiversity consortia\u003cbr\u003eundertaking innovative, high-risk research projects in the area of bioeconomy.\u003cbr\u003eThe initiative is designed to promote collaborative working and reduce risk for\u003cbr\u003eresearch-active SMEs that are seeking to carry out bioeconomic research in\u003cbr\u003eGermany.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: With this funding initiative (KMU-innovativ: Bio\u00f6konomie), Bundesministerium f\u00fcr\u003cbr\u003eForschung, Technologie und Raumfahrt (BMFTR - Federal Ministry of Research,\u003cbr\u003eTechnology and Space) aims to support cutting-edge research by small and medium-\u003cbr\u003esized enterprises (SMEs) that work with modern bioeconomy in their research\u003cbr\u003eactivities. In particular, the initiative helps reduce risk for research\u003cbr\u003eprojects, and promotes cooperation between consortia involving different SMEs,\u003cbr\u003elarger corporations and academic research organisations. The aim of the funding\u003cbr\u003emeasure is to support technologically challenging projects that are aimed at the\u003cbr\u003eefficient and sustainable use of biological knowledge, renewable resources, by-\u003cbr\u003eproducts as well as residual materials. The main focus is on the development and\u003cbr\u003emanufacture \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 15.10.2026\u003cbr\u003e\u003cb\u003eMax value\u003c\u002fb\u003e: Discretionary","\u003cb\u003eEUREKA: CELTIC-NEXT\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Fund\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: EUREKA\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Support for international collaborative R&D projects to develop next-generation\u003cbr\u003etelecommunications for future digital society, covering network and cloud\u003cbr\u003einfrastructure, ICT technologies, AI, Internet of Things, 5G, 6G and other\u003cbr\u003eadvanced digital services.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: CELTIC-NEXT is the EUREKA Cluster programme to support RD&I of next-generation\u003cbr\u003etelecommunications within the ICT domain. CELTIC-NEXT focuses on\u003cbr\u003etelecommunications and ICT for a secure and sustainable digital society, with\u003cbr\u003ethe central aim of connecting people and businesses to foster the digital\u003cbr\u003einclusive society. The current phase of the CELTIC-NEXT programme (2026 to 2032)\u003cbr\u003eaims to accelerate the development and take-up of advanced ICT for high-\u003cbr\u003eperformance communications networks, focusing on exploiting the new network\u003cbr\u003econcepts of 5G and leading the development and implementation of 6G, working\u003cbr\u003etowards positioning European industry as leading suppliers of the advanced ICT\u003cbr\u003eequipment and services needed for the new digital society. Its model for support\u003cbr\u003eis based on a bottom-up, \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 26.10.2026\u003cbr\u003e\u003cb\u003eMax value\u003c\u002fb\u003e: Discretionary","\u003cb\u003eINTERREG Upper Rhine\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Fund\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: European Commission\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding is available for transregional cooperation projects in the Upper Rhine\u003cbr\u003eregion of France, Switzerland and Germany. The focus of Interreg is on transfer\u003cbr\u003eof research results and knowledge sharing.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Interreg\u00a0is the European Union's instrument to support cooperation across\u003cbr\u003eregions and countries: a new generation of\u00a0Interreg\u00a0programmes in and outside\u003cbr\u003ethe EU will further develop joint services and strengthen\u003cbr\u003esolidarity.\u00a0Interreg\u00a0provides funding for projects between Member States, their\u003cbr\u003eoutermost regions, the EU acceding countries and the neighbourhood countries.\u003cbr\u003eFor 2021-2027,\u00a0Interreg\u00a0has a total budget of almost \u20ac10.1 billion covering 86\u003cbr\u003eprogrammes and four strands:      Cross-border (Interreg\u00a0A).     Transnational\u003cbr\u003e(Interreg\u00a0B).     Interregional\u00a0(Interreg\u00a0C).     Integration of Outermost\u003cbr\u003eRegions (Interreg\u00a0D).  Interreg Upper Rhine (Interreg Oberrhein\u002fInterreg Rhin\u003cbr\u003eSup\u00e9rieur)\u00a0is a cross-border cooperation programme (Interreg A) for the French-\u003cbr\u003eGerman-Swiss border region and is part of \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 10.12.2026\u003cbr\u003e\u003cb\u003eMax value (EUR)\u003c\u002fb\u003e: 5000000.0\u003cbr\u003e\u003cb\u003eMax value\u003c\u002fb\u003e: 5,000,000 EUR","\u003cb\u003eBW Stiftung - Earth Observation for Livable Cities and Regions\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Fund\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: Baden-W\u00fcrttemberg Stiftung gGmbH (BW Stiftung - Baden-W\u00fcrttemberg Foundation)\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Grants for interdisciplinary collaborative projects on Earth observation that\u003cbr\u003eaim to shape resilient, sustainable and livable cities and regions in the German\u003cbr\u003estate of Baden-W\u00fcrttemberg.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Baden-W\u00fcrttemberg Stiftung (BW Stiftung - Baden-W\u00fcrttemberg Foundation) is one\u003cbr\u003eof the biggest foundations of private law in Germany. It was established in 2000\u003cbr\u003eas a successor of Landesstiftung Baden-W\u00fcrttemberg and remains directly\u003cbr\u003eaffiliated with the federal state of Baden-W\u00fcrttemberg. BW Stiftung is designed\u003cbr\u003eto strengthen and secure the future success of Baden-W\u00fcrttemberg. It promotes\u003cbr\u003eeducation, networking and innovative research in science, industry and society.\u003cbr\u003eThe Earth Observation for Livable Cities and Regions (Erdbeobachtung f\u00fcr\u003cbr\u003elebenswerte St\u00e4dte und Regionen) programme aims to foster internationally\u003cbr\u003ecompetitive projects and to position Baden-W\u00fcrttemberg as a model region for\u003cbr\u003eintegrated Earth observation, with the goal of using scientific evidence to\u003cbr\u003eshape resilient, sustainable \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 15.10.2026\u003cbr\u003e\u003cb\u003eMax value\u003c\u002fb\u003e: Discretionary","\u003cb\u003eSPRIND Challenge: Recoding Medicine\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Fund\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: Bundesagentur f\u00fcr Sprunginnovationen (SPRIND - German Federal Agency for\u003cbr\u003eBreakthrough Innovation)\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding for interdisciplinary teams that develop AI-ready health datasets and\u003cbr\u003eclinically relevant AI applications that unlock the value of European health\u003cbr\u003edata.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: Bundesagentur f\u00fcr Sprunginnovationen (SPRIND - German Federal Agency for\u003cbr\u003eBreakthrough Innovation) acts as a forum between the German government,\u003cbr\u003eindustry, and research representatives. SPRIND\u00a0finances international research\u003cbr\u003eand development projects for ground-breaking technologies and topics\u00a0that have\u003cbr\u003ethe potential to fundamentally improve people's lives. The aim of the SPRIND\u003cbr\u003eChallenge: Recoding Medicine is to unlock Europe's fragmented health data for\u003cbr\u003eartificial intelligence (AI) innovation by supporting the creation of high-\u003cbr\u003equality, AI-ready health datasets and demonstrating their value through\u003cbr\u003eclinically relevant AI applications. Teams are expected to curate at least one\u003cbr\u003eunique health dataset of high clinical or societal relevance and use it to\u003cbr\u003edevelop AI solutions such as biomarkers, \u2026\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 16.10.2026\u003cbr\u003e\u003cb\u003eMax value (EUR)\u003c\u002fb\u003e: 5000000.0\u003cbr\u003e\u003cb\u003eMax value\u003c\u002fb\u003e: 5,000,000 EUR","\u003cb\u003eVolkswagenStiftung - NEXT\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Fund\u003cbr\u003e\u003cb\u003eFunding body\u003c\u002fb\u003e: VolkswagenStiftung (Volkswagen Foundation)\u003cbr\u003e\u003cb\u003eSummary\u003c\u002fb\u003e: Funding programme to support interdisciplinary research in emerging research\u003cbr\u003efields.\u00a0The programme supports international research teams with majority\u003cbr\u003econtributions from Germany.\u003cbr\u003e\u003cb\u003eDescription\u003c\u002fb\u003e: The VolkswagenStiftung (Volkswagen Foundation), is an independent, non-\u003cbr\u003ecorporate, non-profit foundation dedicated to the support of the humanities and\u003cbr\u003esocial sciences, as well as science and technology in higher education and\u003cbr\u003eresearch. The funding framework NEXT is designed to stimulate advances within\u003cbr\u003ethe scientific landscape through targeted support for emerging research fields.\u003cbr\u003eIt focuses on what could be 'next' in research. Within this framework, the\u003cbr\u003eVolkswagen Foundation takes up new or less explored research topics and\u003cbr\u003eapproaches that have a high knowledge potential and relevance for the future.\u003cbr\u003eThe foundation issues individual thematic calls dedicated to specific research\u003cbr\u003eareas.\u003cbr\u003e\u003cb\u003eDeadline\u003c\u002fb\u003e: 06.10.2026\u003cbr\u003e\u003cb\u003eMax value (EUR)\u003c\u002fb\u003e: 650000.0\u003cbr\u003e\u003cb\u003eMax value\u003c\u002fb\u003e: 650,000 EUR","\u003cb\u003eBMFTR - Exploratory Research Approaches in Fusion\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eType\u003c\u002fb\u003e: Fund\u003cbr\u003e\u003cb\u003eFunding body\ <script>
window.addEventListener("load", function() {
  var gd = document.querySelector(".plotly-graph-div");
  if (!gd) return;
  var TSM = {};
  var ASM = {};
  gd.on("plotly_restyle", function(evt) {
    if (!evt || !evt[1]) return;
    evt[1].forEach(function(ti) {
      var sg = TSM[String(ti)];
      if (!sg) return;
      var visible = gd.data[ti].visible;
      var show = visible === true || visible === undefined;
      var newAnns = gd.layout.annotations.map(function(a, ai) {
        return ASM[String(ai)] === sg ? Object.assign({}, a, {opacity: show ? 0.92 : 0}) : a;
      });
      Plotly.relayout(gd, {annotations: newAnns});
    });
  });
  gd.on("plotly_doubleclick", function() {
    setTimeout(function() {
      var newAnns = gd.layout.annotations.map(function(a, ai) {
        var sg = ASM[String(ai)];
        var show = true;
        Object.keys(TSM).forEach(function(ti) {
          if (TSM[ti] === sg) {
            var v = gd.data[parseInt(ti)].visible;
            if (v === false || v === "legendonly") show = false;
          }
        });
        return Object.assign({}, a, {opacity: show ? 0.92 : 0});
      });
      Plotly.relayout(gd, {annotations: newAnns});
    }, 100);
  });
});
</script></body>
